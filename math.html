<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>最難関突破 AI数学講師 v2.8.5</title>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] },
            startup: { typeset: false }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; --hard: #e74c3c; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.5; font-size: 14px; overflow-x: hidden; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .version-tag { font-size: 0.6rem; color: #888; font-family: monospace; background: #333; padding: 2px 6px; border-radius: 4px;}
        .debug-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        .canvas-container { background: #ffffff; border-radius: 6px; height: 260px; margin-bottom: 5px; overflow: hidden; position: relative; touch-action: none; border: 2px solid #333; }
        #svg-layer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: 0 0; transition: transform 0.05s ease-out; cursor: grab; flex-direction: column; color: #444; font-size: 0.8rem; }
        #svg-layer:active { cursor: grabbing; }
        .disclaimer { font-size: 0.65rem; color: #888; text-align: center; margin-bottom: 10px; display: none; }
        .loading-overlay { display: none; text-align: center; padding: 25px; background: rgba(0,0,0,0.95); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85rem; margin-bottom: 8px; transition: 0.2s; }
        .btn-ai-gen { background: var(--ai); color: white; }
        .btn-hard { background: var(--hard); color: white; }
        .btn-camera { background: var(--success); color: white; flex: 1; }
        .btn-answer-only { background: #555; color: white; flex: 1; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        #dev-val { cursor: pointer; border-bottom: 1px dashed var(--primary); padding: 0 5px; }
        #dev-val:focus { background: #333; outline: none; border-bottom: 1px solid var(--success); color: var(--success); }
        .manual-mode { color: var(--success) !important; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #444; font-size: 0.8rem; cursor: pointer; }
        .score-badge { background: #444; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        #p-text, #q-list li, #h-box, #res-box { white-space: pre-wrap; word-break: break-word; }
        .wait-info { font-size: 0.65rem; color: #888; margin-top: 10px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="debug-bar">
        <label><input type="checkbox" id="debug-mode"> DEBUG</label>
        <span class="version-tag">ver 2.8.5 Strong-Structure</span>
    </div>

    <div class="card">
        <div class="header-flex"><h1>分析パネル</h1></div>
        <div style="display:flex; justify-content:space-around; text-align:center;">
            <div>
                <div style="font-size:0.65rem; color:#aaa;">推定偏差値 <span style="font-size:0.5rem; color:var(--primary);">(タップ編集可)</span></div>
                <div style="display:flex; align-items:baseline; justify-content:center;">
                    <span id="dev-val" class="stat-val" contenteditable="true" inputmode="decimal">50.0</span>
                </div>
            </div>
            <div><div style="font-size:0.65rem; color:#aaa;">累計演習</div><div id="count-val" class="stat-val">0</div></div>
        </div>
        <div id="target-school" style="text-align:center; font-size:0.75rem; color:var(--hint); margin-top:5px; font-weight:bold;">[都立中堅]</div>
        <div id="unit-chart" style="margin-top:10px; font-size:0.8rem;"></div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>演習 [<span id="u-title"></span>]</h1>
            <button onclick="doSkip()" style="background:var(--skip); color:white; border:none; border-radius:4px; padding:6px 12px; font-size:0.85rem; width:auto;">他単元へ ≫</button>
        </div>
        <div class="canvas-container" id="zoom-box"><div id="svg-layer"></div></div>
        <div id="diag-disclaimer" class="disclaimer">※図は必ずしも正確ではありません（移動・拡大可）</div>
        <div id="math-content-area">
            <p id="p-text" style="font-weight:bold; margin: 8px 0; color: #ccc; border-bottom: 1px dashed #444; padding-bottom: 8px;"></p>
            <ul id="q-list" style="padding-left: 20px; margin: 12px 0; list-style:none;"></ul>
            <div id="h-box" style="display:none; color:var(--hint); font-size:0.85rem; padding:10px; background:#332b1e; border-radius:5px; margin:10px 0;"></div>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:6px; font-size:0.8rem; flex:1;">💡 ヒント</button>
            <button class="btn-ai-gen" onclick="generateNext(false)" style="flex:1.5;">✨ 類題作成</button>
            <button class="btn-hard" onclick="generateNext(false, true)" style="flex:1.5;">🔥 最難関へ</button>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; gap:10px;">
            <button class="btn-camera" onclick="document.getElementById('c-input').click()">📸 撮影して採点</button>
            <button class="btn-answer-only" onclick="peekAnswer()">🔍 解答を確認</button>
        </div>
        <input type="file" id="c-input" accept="image/*" capture="environment" style="display:none">
        <div id="res-box" style="background:#111; padding:15px; border-radius:8px; display:none; border-left:4px solid var(--primary); margin-top:10px; font-size:0.85rem;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>復習リスト</h1><button onclick="resetData()" style="background:none; border:none; color:#888; font-size:0.7rem; width:auto;">リセット</button></div>
        <div id="hist-list"></div>
    </div>

    <div id="status-ui" class="loading-overlay">
        <div id="timer" style="font-size:1.8rem; color:var(--ai); font-family:monospace; margin-bottom:10px;">0.0s</div>
        <p id="msg" style="font-weight:bold;"></p>
        <p id="level-msg" style="font-size:0.75rem; color:var(--primary); margin-top:5px;"></p>
        <div class="wait-info">※高品質な構成のため最大1分かかる場合があります。<br>中断する場合は下のボタンを押してください。</div>
        <button class="btn-cancel" onclick="abortGeneration()" style="background:#444; color:#ccc; padding:8px 20px; border-radius:8px; border:none; margin-top:15px;">作成を中断</button>
    </div>

    <script>
        let currentAbortController = null;
        let drawingAbortController = null;
        let drawingLock = false;
        let manualDev = null;
        let state = { prob: {}, scale: 1, x: 0, y: 0, t: null, dt: null, graded: false, seen_answer: false, prefetched_answer: null };

        document.addEventListener('DOMContentLoaded', () => {
            applyProb({ unit: "数と式", text: "次の等式が成り立つとき、条件に従って問いに答えよ。", sub: ["$x + y = 3, xy = 1$ のとき、$x^2 + y^2$ の値を求めよ。"], has_diagram: false });
            refreshStats(); setupDevEdit(); initZoom();
        });

        function cleanText(t, index = null) {
            if (!t) return "";
            let s = (typeof t === 'object') ? (t.text || t.question || JSON.stringify(t)) : String(t);
            if (index === null) {
                s = s.replace(/^[\s\S]*?(ヒント|解説|解答)：?/g, "");
                s = s.replace(/^\(\d+\)\s*/, "");
            }
            s = s.replace(/riangle/g, "\\triangle ").replace(/\\triangle(?![ \s])/g, "\\triangle ");
            if (!s.includes('$')) s = s.replace(/([a-zA-Z0-9]+)\^([a-zA-Z0-9]+)/g, '$$$1^$2$$');
            s = s.replace(/^数学$|^講師$|^問題$|^解説$|^・数学$/g, "").replace(/・/g, ""); 
            if (index !== null) { s = s.replace(/^\(\d+\)\s*/, ""); s = `(${index}) ` + s.trim(); }
            return s.trim();
        }

        function applyProb(p) {
            if (!p || (!p.text && !p.problem)) {
                document.getElementById('p-text').innerText = "データ取得エラー。再試行してください。";
                return;
            }
            state.prob = p;
            state.graded = false; state.seen_answer = false; state.prefetched_answer = null;
            resetView();
            document.getElementById('u-title').innerText = p.unit || "総合";
            document.getElementById('p-text').innerText = cleanText(p.text);
            
            // 【新ルール】小問は必ずリスト表示。重複判定は行わずAIに分離を任せる。
            const rawSub = p.sub || p.questions || p.q || [];
            const subArray = (Array.isArray(rawSub) ? rawSub : [rawSub]).filter(q => q && String(q).length > 0);
            
            if (subArray.length === 0) {
                document.getElementById('q-list').innerHTML = "<li>(1) 問いを特定できませんでした。再生成してください。</li>";
            } else {
                document.getElementById('q-list').innerHTML = subArray.map((q, i) => `<li>${cleanText(q, i+1)}</li>`).join('');
            }
            
            document.getElementById('h-box').innerText = cleanText(p.hint) || "基本原理を再確認せよ。";
            document.getElementById('h-box').style.display = 'none';
            document.getElementById('res-box').style.display = 'none';
            
            const zoomBox = document.getElementById('zoom-box');
            const disclaimer = document.getElementById('diag-disclaimer');
            if (p.has_diagram || (p.unit && (p.unit.includes("関数") || p.unit.includes("幾何")))) {
                zoomBox.style.display = 'block'; disclaimer.style.display = 'block';
                document.getElementById('svg-layer').innerHTML = `<div style="color:var(--ai);">🎨 図解を構成中...</div><div id="draw-timer-val" style="font-family:monospace;">0.0s</div>`;
                setTimeout(() => autoDraw(0), 100);
            } else { zoomBox.style.display = 'none'; disclaimer.style.display = 'none'; }
            renderMath(); prefetchAnswer();
        }

        async function autoDraw(retry = 0) {
            if (drawingLock || retry > 1) return;
            drawingLock = true; drawingAbortController = new AbortController();
            let start = Date.now(); if (state.dt) clearInterval(state.dt);
            state.dt = setInterval(() => { const el = document.getElementById('draw-timer-val'); if (el) el.innerText = ((Date.now() - start) / 1000).toFixed(1) + "s"; }, 100);
            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    signal: drawingAbortController.signal,
                    body: JSON.stringify({ contents: [{ parts: [{ text: `問題「${state.prob.text}」の可視化SVG。点名と数値のみ。日本語文章禁止。` }] }] })
                });
                let svgContent = (await res.json()).candidates[0].content.parts[0].text.match(/<svg[\s\S]*?<\/svg>/i);
                if (svgContent) {
                    let svg = svgContent[0].replace(/<text(.*?)>(.*?)<\/text>/gi, (m, p1, p2) => {
                        const cl = p2.replace(/\$|\\/g, '').trim();
                        return (cl.length === 1 || /^\d+(\.\d+)?$/.test(cl)) ? `<text${p1}>${cl}</text>` : '';
                    });
                    document.getElementById('svg-layer').innerHTML = svg;
                } else throw new Error();
            } catch (e) {
                if (e.name === 'AbortError') return;
                setTimeout(() => { drawingLock = false; autoDraw(retry + 1); }, 500);
            } finally { clearInterval(state.dt); drawingLock = false; drawingAbortController = null; }
        }

        async function generateNext(isOther = false, isHardMode = false) {
            if (drawingAbortController) drawingAbortController.abort();
            drawingLock = false; if (state.dt) clearInterval(state.dt);
            let devValue = manualDev !== null ? manualDev : parseFloat(document.getElementById('dev-val').innerText);
            if (isHardMode) devValue = 80;
            const units = ["幾何", "関数", "整数", "確率"];
            let target = units[Math.floor(Math.random() * units.length)];
            showUI(`${target}を構成中...`, devValue);
            currentAbortController = new AbortController();
            
            // 【新構成プロンプト】textとsubの役割を完全に分ける
            const prompt = `あなたは数学講師です。全て日本語で回答。単元は必ず「${target}」。偏差値${devValue}向け。
            【絶対指示】
            1. textには「状況設定・数値条件」のみを書け。
            2. subには「〜を求めよ」という問いを必ず1つ以上書け。
            3. textの中に問いを書くな。
            4. JSON(text, sub, unit, hint, has_diagram)のみ。数式$ $。`;

            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    signal: currentAbortController.signal,
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const data = await res.json();
                applyProb(JSON.parse(data.candidates[0].content.parts[0].text));
                hideUI();
            } catch (e) { if (e.name !== 'AbortError') hideUI(); }
        }

        function initZoom() {
            const container = document.getElementById('zoom-box');
            let isDrag = false, sx, sy;
            container.addEventListener('wheel', (e) => { e.preventDefault(); state.scale = Math.min(Math.max(0.5, state.scale * (e.deltaY > 0 ? 0.9 : 1.1)), 5); updateView(); }, { passive: false });
            container.addEventListener('mousedown', (e) => { isDrag = true; sx = e.clientX - state.x; sy = e.clientY - state.y; });
            window.addEventListener('mousemove', (e) => { if (!isDrag) return; state.x = e.clientX - sx; state.y = e.clientY - sy; updateView(); });
            window.addEventListener('mouseup', () => isDrag = false);
            container.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { isDrag = true; sx = e.touches[0].clientX - state.x; sy = e.touches[0].clientY - state.y; } }, { passive: true });
            container.addEventListener('touchmove', (e) => { if (e.touches.length === 1 && isDrag) { state.x = e.touches[0].clientX - sx; state.y = e.touches[0].clientY - sy; updateView(); } }, { passive: false });
            container.addEventListener('touchend', () => isDrag = false);
        }
        function updateView() { document.getElementById('svg-layer').style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`; }
        function resetView() { state.scale = 1; state.x = 0; state.y = 0; updateView(); }
        function renderMath() { if (window.MathJax && window.MathJax.typesetPromise) { const targets = [document.getElementById('math-content-area'), document.getElementById('res-box')]; MathJax.typesetPromise(targets); setTimeout(() => MathJax.typesetPromise(targets), 500); } }
        function setupDevEdit() {
            const el = document.getElementById('dev-val');
            el.addEventListener('blur', () => {
                let val = parseFloat(el.innerText);
                if (isNaN(val)) { manualDev = null; refreshStats(); }
                else { manualDev = Math.min(Math.max(val, 0), 100); el.innerText = manualDev.toFixed(1); el.classList.add('manual-mode'); updateTargetSchool(manualDev); }
            });
            el.addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.preventDefault(); el.blur(); } });
        }
        function updateTargetSchool(dev) {
            let s = "[都立中堅]";
            if (dev >= 72) s = "[筑駒]"; else if (dev >= 68) s = "[開成]"; else if (dev >= 62) s = "[日比谷]"; else if (dev >= 55) s = "[上位校]";
            document.getElementById('target-school').innerText = s;
        }
        async function doGrade(file) {
            if (state.seen_answer) { alert("解答閲覧済のため不可。"); return; }
            showUI("採点中...");
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const res = await fetch(`/api/chat`, {
                        method: "POST", headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ contents: [{ parts: [{ text: `日本語採点。Score: X/10を末尾に。問題：${state.prob.text}` }, { inlineData: { mimeType: file.type, data: e.target.result.split(',')[1] } }] }] })
                    });
                    const fb = cleanText((await res.json()).candidates[0].content.parts[0].text);
                    document.getElementById('res-box').innerHTML = fb; document.getElementById('res-box').style.display = 'block';
                    saveLog(fb.includes("Score: 10") ? "○" : "×", parseInt((fb.match(/Score:\s*(\d+)/i)||[0,0])[1]));
                    renderMath();
                } finally { hideUI(); }
            };
            reader.readAsDataURL(file);
        }
        function saveLog(mark, score) {
            let h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            h.unshift({ d: new Date().toLocaleDateString(), u: state.prob.unit || "総合", m: mark, s: score, p: state.prob });
            localStorage.setItem('m_hist', JSON.stringify(h.slice(0, 30))); refreshStats();
        }
        function refreshStats() {
            const h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            document.getElementById('count-val').innerText = h.length;
            document.getElementById('hist-list').innerHTML = h.slice(0,10).map((x, i) => `<div class="history-item" onclick="loadHist(${i})"><span>${x.d} ${x.u}</span><div><span class="score-badge">${x.s}/10</span> ${x.m}</div></div>`).join('');
            if (manualDev === null) {
                let dev = 50.0; if (h.length >= 1) dev = 40 + ((h.map(x => x.s).reduce((a,b)=>a+b,0)/h.length) * 3.5);
                document.getElementById('dev-val').innerText = dev.toFixed(1); updateTargetSchool(dev);
            }
        }
        async function prefetchAnswer() {
            try {
                const res = await fetch(`/api/chat`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ contents: [{ parts: [{ text: `日本語解答解説。問題文の再掲禁止。問題：${state.prob.text}` }] }] }) });
                state.prefetched_answer = cleanText((await res.json()).candidates[0].content.parts[0].text);
            } catch (e) {}
        }
        function peekAnswer() {
            if (state.seen_answer) return; if (!confirm("0点になります。")) return;
            state.seen_answer = true; document.getElementById('res-box').innerHTML = state.prefetched_answer || "取得中...";
            document.getElementById('res-box').style.display = 'block'; saveLog("×", 0); renderMath();
        }
        function showUI(m, dev = null) { 
            document.getElementById('status-ui').style.display='block'; document.getElementById('msg').innerText=m; 
            document.getElementById('level-msg').innerText = dev ? `目標：偏差値 ${dev.toFixed(1)}` : "";
            let s=Date.now(); clearInterval(state.t); state.t=setInterval(()=>{document.getElementById('timer').innerText=((Date.now()-s)/1000).toFixed(1)+"s";},100); 
        }
        function hideUI() { document.getElementById('status-ui').style.display='none'; clearInterval(state.t); }
        function abortGeneration() { if (currentAbortController) currentAbortController.abort(); if (drawingAbortController) drawingAbortController.abort(); hideUI(); }
        function toggleHint() { const b = document.getElementById('h-box'); b.style.display = (b.style.display === 'block') ? 'none' : 'block'; renderMath(); }
        function loadHist(i) { applyProb(JSON.parse(localStorage.getItem('m_hist'))[i].p); }
        function doSkip() { generateNext(true); }
        function resetData() { if(confirm("リセット？")) { manualDev = null; localStorage.clear(); location.reload(); } }
        document.getElementById('c-input').onchange = (e) => doGrade(e.target.files[0]);
    </script>
</body>
</html>
