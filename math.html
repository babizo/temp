<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI数学講師：実力連動型・最難関対策</title>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            options: { enableMenu: false },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    startMathObserver();
                }
            }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; --hard: #e74c3c; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.6; font-size: 14px; overflow-x: hidden; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; position: relative; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .debug-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        
        .dev-control-box { width: 100%; padding: 5px 0; }
        .dev-display-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 5px; }
        #dev-slider { width: 100%; height: 8px; border-radius: 5px; background: #444; outline: none; -webkit-appearance: none; margin: 15px 0 5px 0; }
        #dev-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); cursor: pointer; border: 2px solid #fff; }
        
        .scale-labels { display: flex; justify-content: space-between; padding: 0; margin-top: 8px; position: relative; width: 100%; height: 35px; }
        .scale-labels span { font-size: 0.52rem; color: #888; text-align: center; line-height: 1.1; position: absolute; transform: translateX(-50%); white-space: nowrap; }
        
        .canvas-container { background: #ffffff; border-radius: 6px; height: 260px; margin-bottom: 5px; overflow: hidden; position: relative; border: 2px solid #333; display: flex; align-items: center; justify-content: center; }
        #svg-layer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: 0 0; transition: transform 0.05s ease-out; cursor: grab; flex-direction: column; color: #444; font-size: 0.8rem; text-align: center; }
        .stat-val { font-size: 1.8rem; font-weight: bold; color: var(--primary); font-family: monospace; }
        .target-label { font-size: 0.8rem; color: var(--hint); font-weight: bold; min-width: 140px; text-align: left; }
        
        .draw-timer-text { font-family: monospace; font-size: 1.2rem; color: var(--ai); margin-top: 5px; }
        .btn-redraw { position: absolute; right: 10px; top: 50px; background: #444; color: #fff; border: 1px solid #666; padding: 3px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; z-index: 10; font-weight: bold; }
        #p-text, #q-list li, #h-box, #res-box { white-space: pre-wrap; word-break: break-word; }
        a { color: var(--primary); text-decoration: underline; }

        .loading-overlay { display: none; text-align: center; padding: 25px; background: rgba(0,0,0,0.98); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 15%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85rem; margin-bottom: 8px; }
        .btn-ai-gen { background: var(--ai); color: white; }
        .btn-camera { background: var(--success); color: white; flex: 1; }
        
        .canvas-footer { font-weight: bold; font-size: 0.75rem; text-align: center; line-height: 1.4; margin-bottom: 10px; }
        .text-alert { color: #ffadad; }
        .text-dim { color: #888; font-weight: normal; font-size: 0.65rem; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #444; font-size: 0.8rem; cursor: pointer; }
        .score-badge { background: #444; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="debug-bar">
        <label><input type="checkbox" id="debug-mode"> DEBUG</label>
        <span class="version-tag">ver 3.4.9 Ans-Reliable</span>
    </div>

    <div class="card">
        <div class="header-flex"><h1>実力相応校・推定レベル設定</h1></div>
        <div class="dev-control-box">
            <div style="font-size:0.75rem; color:#aaa; text-align:center; margin-bottom:5px;">※演習結果により自動的に推定レベルが更新されます。</div>
            <div class="dev-display-row">
                <span id="dev-val" class="stat-val">60.0</span>
                <span id="target-school" class="target-label">[日比谷・学芸]</span>
            </div>
            <input type="range" id="dev-slider" min="30" max="80" step="0.5" value="60">
            <div class="scale-labels">
                <span style="left: 0%;">30</span><span style="left: 52%;">56<br>西</span><span style="left: 60%;">60<br>日比谷</span><span style="left: 68%;">64<br>早慶</span><span style="left: 76%;">68<br>渋幕</span><span style="left: 84%;">72<br>開成</span><span style="left: 92%;">76<br>筑駒</span>
            </div>
        </div>
        <div style="text-align:center; border-top:1px solid #444; padding-top:10px; margin-top:20px;">
            <div style="font-size:0.65rem; color:#aaa;">累計演習</div><div id="count-val" class="stat-val" style="font-size:1.2rem;">0</div>
        </div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>試験問題 [<span id="u-title"></span>]</h1>
            <button onclick="doSkip()" style="background:var(--skip); color:white; border:none; border-radius:4px; padding:6px 12px; font-size:0.85rem; width:auto;">他単元へ ≫</button>
        </div>
        <div class="btn-redraw" onclick="safeRender()">↻ 再描画</div>
        <div class="canvas-container" id="zoom-box"><div id="svg-layer"></div></div>
        
        <div id="canvas-footer" class="canvas-footer" style="display:none;">
            <div class="text-alert">※高品質な構成のため最大1分程かかる場合があります</div>
            <div class="text-dim">※図は必ずしも正確ではありません（移動・拡大可）</div>
        </div>

        <div id="math-content-area">
            <p id="p-text" style="font-weight:bold; margin: 8px 0; color: #ccc; border-bottom: 1px dashed #444; padding-bottom: 8px;"></p>
            <ul id="q-list" style="padding-left: 20px; margin: 12px 0; list-style:none;"></ul>
            <div id="h-box" style="display:none; color:var(--hint); font-size:0.85rem; padding:10px; background:#332b1e; border-radius:5px; margin:10px 0; border-left:4px solid var(--hint);"></div>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:6px; font-size:0.8rem; flex:1;">💡 助言を表示</button>
            <button class="btn-ai-gen" onclick="generateNext(false)" style="flex:1.5;">✨ 推定レベルで出題</button>
            <button class="btn-hard" onclick="generateNext(false, true)" style="background:var(--hard); color:white; flex:1.5;">🔥 最難関へ</button>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; gap:10px;">
            <button class="btn-camera" onclick="document.getElementById('c-input').click()">📸 撮影して採点</button>
            <button id="ans-toggle-btn" class="btn-answer-only" onclick="peekAnswer()" style="background:#555; color:white; flex:1;">🔍 解答を確認</button>
        </div>
        <input type="file" id="c-input" accept="image/*" capture="environment" style="display:none">
        <div id="res-box" style="background:#111; padding:15px; border-radius:8px; display:none; border-left:4px solid var(--primary); margin-top:10px; font-size:0.85rem;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>演習履歴</h1><button onclick="resetData()" style="background:none; border:none; color:#888; font-size:0.7rem; width:auto;">リセット</button></div>
        <div id="hist-list"></div>
    </div>

    <div id="status-ui" class="loading-overlay">
        <div id="timer" style="font-size:2.2rem; color:var(--ai); font-family:monospace; margin-bottom:10px;">0.0s</div>
        <p id="msg" style="font-weight:bold; color:#fff; font-size:1.1rem;"></p>
        <div class="canvas-footer" style="margin-top:15px;">
            <div class="text-alert">※高品質な構成のため最大1分程かかる場合があります。</div>
        </div>
        <button onclick="abortGeneration()" style="background:#444; color:#ccc; padding:10px; border-radius:8px; border:none; margin-top:15px; width:60%;">中断</button>
    </div>

    <script>
        let currentAbortController = null, drawingAbortController = null, drawingLock = false;
        let isRendering = false, drawInterval = null;
        let state = { prob: {}, scale: 1, x: 0, y: 0, t: null, startTime: 0, seen_answer: false, prefetched_answer: null, last_units: [], current_target_unit: "数と式" };

        function startMathObserver() {
            const observer = new MutationObserver(() => { if (!isRendering) safeRender(); });
            observer.observe(document.getElementById('math-content-area'), { childList: true, subtree: true });
            observer.observe(document.getElementById('res-box'), { childList: true, subtree: true });
        }

        async function safeRender() {
            if (isRendering || !window.MathJax || !MathJax.typesetPromise) return;
            isRendering = true;
            try { await MathJax.typesetPromise(); } catch (e) { }
            finally { setTimeout(() => { isRendering = false; }, 100); }
        }

        window.onload = async () => {
            initZoom(); refreshStats();
            document.getElementById('dev-slider').addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                document.getElementById('dev-val').innerText = val.toFixed(1);
                updateTargetSchool(val);
            });
            
            // 同期処理として問題をセット
            const initialProblem = { 
                unit: "数と式", 
                text: "次の方程式を解き、xの値を求めよ。$2(x-3) = \\frac{x}{2} + 1$", 
                sub: ["方程式 $2(x-3) = \\frac{x}{2} + 1$ を満たす $x$ を求めよ。"], 
                hint: "分母の2を払うために、両辺に2を掛けて整理せよ。" 
            };
            
            applyProb(initialProblem);
            
            // 反映を待ってから解答を事前取得
            setTimeout(() => { prefetchAnswer(); }, 1500);
        };

        function updateTargetSchool(dev) {
            let s = "[標準]";
            if (dev >= 76) s = "[筑駒]"; else if (dev >= 72) s = "[開成]"; else if (dev >= 68) s = "[渋幕・志木]";
            else if (dev >= 64) s = "[筑付・早慶]"; else if (dev >= 60) s = "[日比谷・学芸]";
            else if (dev >= 56) s = "[都立西]"; else if (dev >= 50) s = "[都立上位]";
            else s = "[基礎固め]";
            document.getElementById('target-school').innerText = s;
        }

        function cleanText(t, index = null) {
            if (!t) return "";
            let s = (typeof t === 'object') ? (t.text || t.problem || JSON.stringify(t)) : String(t);
            if (s.includes('{') && s.includes('}')) { try { const m = s.match(/\{[\s\S]*\}/); if (m) { const p = JSON.parse(m[0]); s = p.question_text || p.text || p.problem || s; } } catch(e) {} }
            s = s.replace(/riangle/g, "\\triangle ");
            if (!s.includes('$')) s = s.replace(/([a-z]\s*[=<>]\s*[^ 　\n。]+|[a-z]\^\d+|[A-Z]\([^\)]+\)|\\frac\{[^\}]+\}\{[^\}]+\})/gi, '$$$1$$');
            if (index !== null) s = `(${index}) ` + s.trim();
            return s.trim();
        }

        function applyProb(p) {
            if (!p) return false;
            const mainText = cleanText(p.text || p.problem);
            if (!mainText || mainText.length < 5) return false;
            state.prob = p; state.seen_answer = false; state.prefetched_answer = null; resetView();
            document.getElementById('u-title').innerText = state.current_target_unit;
            document.getElementById('p-text').innerText = mainText;
            const subArray = (Array.isArray(p.sub || p.q) ? (p.sub || p.q) : [p.sub || p.q]).filter(q => q);
            document.getElementById('q-list').innerHTML = subArray.map((q, i) => `<li>${cleanText(q, i+1)}</li>`).join('');
            document.getElementById('h-box').innerText = cleanText(p.hint || p.explanation) || "論理的に思考せよ。";
            document.getElementById('h-box').style.display = 'none'; 
            document.getElementById('res-box').style.display = 'none';
            document.getElementById('ans-toggle-btn').innerText = "🔍 解答を確認";
            const showDiagram = p.has_diagram || /平面図形|関数|立体/.test(state.current_target_unit) || /三角形|円|グラフ|座標/.test(mainText);
            document.getElementById('zoom-box').style.display = showDiagram ? 'flex' : 'none';
            document.getElementById('canvas-footer').style.display = showDiagram ? 'block' : 'none';
            if (showDiagram) startDrawing(mainText);
            safeRender();
            return true;
        }

        function startDrawing(text) {
            if (drawInterval) clearInterval(drawInterval);
            document.getElementById('svg-layer').innerHTML = `<div><b style="color:var(--ai);">作図中...</b></div><div id="draw-timer" class="draw-timer-text">0.0s</div>`;
            const s = Date.now();
            drawInterval = setInterval(() => {
                const el = document.getElementById('draw-timer');
                if (el) el.innerText = ((Date.now() - s) / 1000).toFixed(1) + "s";
            }, 100);
            autoDraw(0, text);
        }

        async function autoDraw(retry = 0, sourceText) {
            if (drawingLock || retry > 2) return;
            drawingLock = true; drawingAbortController = new AbortController();
            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"}, signal: drawingAbortController.signal,
                    body: JSON.stringify({ contents: [{ parts: [{ text: `入試問題「${sourceText}」の可視化SVG。点名と数値のみ。日本語禁止。` }] }] })
                });
                let svg = (await res.json()).candidates[0].content.parts[0].text.match(/<svg[\s\S]*?<\/svg>/i);
                if (svg) { clearInterval(drawInterval); document.getElementById('svg-layer').innerHTML = svg[0]; }
            } catch (e) { if (e.name !== 'AbortError') setTimeout(() => { drawingLock = false; autoDraw(retry + 1, sourceText); }, 500); }
            finally { drawingLock = false; }
        }

        async function generateNext(isOther = false, isHardMode = false, retryCount = 0) {
            if (retryCount === 0) { if (drawingAbortController) drawingAbortController.abort(); drawingLock = false; }
            let currentDev = parseFloat(document.getElementById('dev-val').innerText);
            let devValue = isHardMode ? 76 : currentDev;
            let target = state.current_target_unit;
            if (isOther) {
                const units = ["数と式", "方程式", "関数", "平面図形", "空間図形", "確率", "データの活用"];
                const pool = units.filter(u => u !== state.current_target_unit);
                target = pool[Math.floor(Math.random() * pool.length)];
            }
            state.current_target_unit = target;
            showUI(`${target} (Lv.${devValue.toFixed(1)}) を構成中...`);
            currentAbortController = new AbortController();
            const prompt = `あなたは数学作問委員。受験生の思考力を試す厳格な問題を構成せよ。口調は「～を求めよ」。
補足が必要なら[詳しい説明](URL)を張れ。単元「${target}」、SAPIX偏差値${devValue}相当。JSON(text, sub:[], hint)形式。`;
            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"}, signal: currentAbortController.signal,
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const parsed = JSON.parse((await res.json()).candidates[0].content.parts[0].text);
                if (applyProb(parsed)) {
                    hideUI();
                    setTimeout(() => { prefetchAnswer(); }, 500); // 問題確定後に解答事前取得
                } else throw new Error("Invalid");
            } catch (e) {
                if (retryCount < 3 && e.name !== 'AbortError') generateNext(isOther, isHardMode, retryCount + 1);
                else hideUI();
            }
        }

        function initZoom() {
            const container = document.getElementById('zoom-box');
            let isDrag = false, sx, sy;
            container.onmousedown = (e) => { isDrag = true; sx = e.clientX - state.x; sy = e.clientY - state.y; };
            window.onmousemove = (e) => { if (isDrag) { state.x = e.clientX - sx; state.y = e.clientY - sy; updateView(); } };
            window.onmouseup = () => isDrag = false;
            container.addEventListener('wheel', (e) => { e.preventDefault(); state.scale *= (e.deltaY > 0 ? 0.9 : 1.1); updateView(); }, { passive: false });
        }
        function updateView() { document.getElementById('svg-layer').style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`; }
        function resetView() { state.scale = 1; state.x = 0; state.y = 0; updateView(); }
        function toggleHint() { const b = document.getElementById('h-box'); b.style.display = (b.style.display==='block')?'none':'block'; if(b.style.display==='block') safeRender(); }
        function showUI(m) { 
            document.getElementById('status-ui').style.display='block'; 
            document.getElementById('msg').innerText=m; 
            state.startTime = Date.now(); clearInterval(state.t); 
            state.t = setInterval(()=>{ document.getElementById('timer').innerText=((Date.now()-state.startTime)/1000).toFixed(1)+"s"; },100); 
        }
        function hideUI() { document.getElementById('status-ui').style.display='none'; clearInterval(state.t); }
        function abortGeneration() { if (currentAbortController) currentAbortController.abort(); hideUI(); }
        
        async function prefetchAnswer() { 
            if (!state.prob.text) return;
            try { 
                const res = await fetch(`/api/chat`, { 
                    method: "POST", headers: {"Content-Type": "application/json"}, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: `数学解答作成。問題の解と手順を導出せよ。補足が必要なら[解説](URL)を張れ。問題：${state.prob.text}` }] }] }) 
                }); 
                state.prefetched_answer = (await res.json()).candidates[0].content.parts[0].text; 
            } catch (e) { console.error("Prefetch Failed"); } 
        }

        async function peekAnswer() { 
            const box = document.getElementById('res-box');
            const btn = document.getElementById('ans-toggle-btn');
            if (box.style.display === 'block') { box.style.display = 'none'; btn.innerText = "🔍 解答を表示"; return; }
            
            if (!state.seen_answer) {
                if (!confirm("解答を確認すると本問の偏差値加算は行われません。よろしいですか？")) return; 
                state.seen_answer = true; saveLog("×", 0); 
            }

            // 解答がまだ取得できていない場合の緊急取得
            if (!state.prefetched_answer) {
                btn.innerText = "⏳ 取得中...";
                await prefetchAnswer();
            }

            box.innerHTML = state.prefetched_answer || "解答の取得に失敗しました。もう一度お試しください。"; 
            box.style.display = 'block'; btn.innerText = "🔍 解答を閉じる";
            safeRender();
        }
        
        function loadHist(i) { applyProb(JSON.parse(localStorage.getItem('m_hist'))[i].p); }
        function doSkip() { generateNext(true); }
        function resetData() { if(confirm("消去？")) { localStorage.clear(); location.reload(); } }
        
        function refreshStats() { 
            const h = JSON.parse(localStorage.getItem('m_hist') || "[]"); 
            document.getElementById('count-val').innerText = h.length; 
            document.getElementById('hist-list').innerHTML = h.slice(0,5).map((x, i) => `<div class="history-item" onclick="loadHist(${i})"><span>${x.u}</span><span class="score-badge">${x.s}/10</span></div>`).join('');
            if(h.length > 0) {
                const avg = h.map(x => x.s).reduce((a,b)=>a+b,0) / h.length;
                const dev = Math.min(80, 40 + (avg * 3.5) + (h.length * 0.1));
                document.getElementById('dev-slider').value = dev;
                document.getElementById('dev-val').innerText = dev.toFixed(1);
                updateTargetSchool(dev);
            }
        }
        function saveLog(mark, score) {
            let h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            const probToSave = JSON.parse(JSON.stringify(state.prob));
            h.unshift({ u: state.current_target_unit, s: score, p: probToSave });
            localStorage.setItem('m_hist', JSON.stringify(h.slice(0, 50))); refreshStats();
        }

        document.getElementById('c-input').onchange = (e) => {
            if (state.seen_answer) return; showUI("答案を分析中...");
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const res = await fetch(`/api/chat`, { method: "POST", headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ contents: [{ parts: [{ text: `入試採点。Score: X/10。背景知識が必要なら外部リンクを張れ。問題：${state.prob.text}` }, { inlineData: { mimeType: e.target.files[0].type, data: ev.target.result.split(',')[1] } }] }] })
                    });
                    const fb = (await res.json()).candidates[0].content.parts[0].text;
                    document.getElementById('res-box').innerHTML = fb; document.getElementById('res-box').style.display = 'block';
                    document.getElementById('ans-toggle-btn').innerText = "🔍 解答を閉じる";
                    const score = parseInt((fb.match(/Score:\s*(\d+)/i)||[0,0])[1]);
                    saveLog(score >= 8 ? "○" : "×", score);
                } finally { hideUI(); }
            };
            reader.readAsDataURL(e.target.files[0]);
        };
    </script>
</body>
</html>
