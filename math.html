<script>
    // 重要な変更点：applyProb関数
    function applyProb(p) {
        if (!p || (!p.text && !p.problem)) {
            document.getElementById('p-text').innerText = "データ取得エラー。再試行してください。";
            return;
        }
        state.prob = p;
        state.graded = false; state.seen_answer = false;
        resetView();
        
        document.getElementById('u-title').innerText = p.unit || "総合";
        // 問題文を表示
        document.getElementById('p-text').innerText = cleanText(p.text);
        
        // 小問リストの生成（必ず表示するロジックに変更）
        const rawSub = p.sub || p.questions || [];
        const subArray = (Array.isArray(rawSub) ? rawSub : [rawSub]).filter(q => q && String(q).length > 0);
        
        if (subArray.length === 0) {
            // 万が一小問が空で届いたら、AIに「(1) 答えを求めよ」と補完させるか、
            // 生成時のプロンプトで「必ずsubを作れ」と強制します。
            document.getElementById('q-list').innerHTML = "<li>(1) 問いを特定できませんでした。再生成してください。</li>";
        } else {
            // 重複チェックを廃止し、常にリスト化
            document.getElementById('q-list').innerHTML = subArray.map((q, i) => `<li>${cleanText(q, i+1)}</li>`).join('');
        }
        
        // 以下の図解表示・MathJax等の処理は維持
        renderMath();
    }

    // 生成プロンプトの強化
    async function generateNext(isOther = false, isHardMode = false) {
        // ...中略...
        const prompt = `あなたは数学講師です。
        【絶対ルール】
        1. 構成を厳守せよ：textには「条件設定」のみ、subには「〜を求めよ」という「問い」を必ず1つ以上書くこと。
        2. textの中に問いを書かないこと。
        3. 小問は(1)(2)形式。
        4. 全て日本語。単元「${target}」。偏差値${devValue}向け。JSON(text, sub, unit, hint, has_diagram)。数式$ $。`;
        // ...中略...
    }
</script>
