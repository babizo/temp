<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI数学講師 3.9.11</title>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            options: { enableMenu: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; --hard: #e74c3c; }
        body.light-mode { --bg: #f5f5f5; --card: #ffffff; --text: #333333; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.6; font-size: 14px; overflow-x: hidden; transition: background 0.3s; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; position: relative; }
        body.light-mode .card { border: 1px solid #ddd; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .theme-toggle { background: #444; color: #fff; border: none; border-radius: 4px; padding: 4px 10px; font-size: 0.7rem; cursor: pointer; }
        #dev-slider { width: 100%; height: 8px; border-radius: 5px; background: #444; outline: none; -webkit-appearance: none; margin: 15px 0; }
        #dev-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); cursor: pointer; border: 2px solid #fff; }
        .scale-labels { display: flex; justify-content: space-between; padding: 0; margin-top: 8px; position: relative; width: 100%; height: 45px; }
        .scale-labels span { font-size: 0.5rem; color: #888; text-align: center; position: absolute; transform: translateX(-50%); white-space: nowrap; line-height: 1.1; }
        #canvas-box { display: none; margin-bottom: 10px; }
        .canvas-container { background: #ffffff; border-radius: 6px; height: 240px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #svg-layer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .preview-box { width: 100%; height: 350px; background: #000; border-radius: 8px; overflow: hidden; position: relative; display: none; border: 2px solid var(--primary); touch-action: none; }
        #ans-preview { width: 100%; height: 100%; object-fit: contain; transform-origin: center; pointer-events: none; }
        .crop-overlay { position: absolute; border: 2px dashed #fff; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); box-sizing: border-box; cursor: move; display: none; }
        .crop-handle { position: absolute; width: 18px; height: 18px; background: var(--primary); border: 2px solid #fff; border-radius: 50%; }
        .tl { top: -9px; left: -9px; cursor: nwse-resize; } .tr { top: -9px; right: -9px; cursor: nesw-resize; }
        .bl { bottom: -9px; left: -9px; cursor: nesw-resize; } .br { bottom: -9px; right: -9px; cursor: nwse-resize; }
        #p-text, #q-list li, #h-box, #res-box { white-space: pre-wrap; word-break: break-word; }
        .loading-overlay { display: none; text-align: center; padding: 25px; background: rgba(0,0,0,0.98); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 15%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85rem; margin-bottom: 8px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 5px; border-bottom: 1px solid #444; font-size: 0.75rem; }
        .score-badge { background: #444; padding: 2px 8px; border-radius: 4px; font-weight: bold; min-width: 35px; text-align: center; }
        .prob-lv-badge { font-size: 0.7rem; background: #444; color: #fff; padding: 1px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }
        /* 変換中アニメーション */
        .typing-loader { color: var(--ai); font-size: 0.9rem; font-weight: bold; text-align: center; padding: 20px; display: none; }
        .typing-loader::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
    </style>
</head>
<body>

    <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items: center;">
        <div style="font-size:0.7rem; color:#888;">
            <label style="cursor:pointer;"><input type="checkbox" id="debug-mode"> DEBUG</label> ver 3.9.11
        </div>
        <button class="theme-toggle" onclick="document.body.classList.toggle('light-mode')">🌓 モード切替</button>
    </div>

    <div class="card">
        <div class="header-flex"><h1>推定レベル設定</h1></div>
        <div style="text-align:center;">
            <span id="dev-val" style="font-size:1.8rem; font-weight:bold; color:var(--primary); font-family:monospace;">60.0</span>
            <span id="target-school" style="color:var(--hint); font-weight:bold; margin-left:10px;">[日比谷]</span>
        </div>
        <input type="range" id="dev-slider" min="45" max="80" step="0.5" value="60">
        <div class="scale-labels">
            <span style="left:0%;">45</span>
            <span style="left:31.4%;">56<br>西</span>
            <span style="left:42.8%;">60<br>日比谷</span>
            <span style="left:54.2%;">64<br>学芸<br>早実</span>
            <span style="left:65.7%;">68<br>志木<br>筑付</span>
            <span style="left:71.4%;">70<br>渋幕</span>
            <span style="left:77.1%;">72<br>開成</span>
            <span style="left:88.5%;">76<br>筑駒</span>
        </div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>問題 [<span id="u-title">数と式</span>]<span id="prob-lv" class="prob-lv-badge">Lv.60.0</span></h1>
            <button onclick="doSkip()" style="background:var(--skip); color:white; padding:6px 12px; width:auto; border-radius:4px;">他単元へ ≫</button>
        </div>
        <div id="canvas-box"><div class="canvas-container"><div id="svg-layer"></div></div></div>
        
        <div id="typing-msg" class="typing-loader">数式をきれいに変換中</div>
        <div id="math-content-area">
            <p id="p-text" style="font-weight:bold; color:#ccc; border-bottom:1px dashed #444; padding-bottom:8px;"></p>
            <ul id="q-list" style="padding-left:20px; list-style:none;"></ul>
            <div id="h-box" style="display:none; color:var(--hint); font-size:0.85rem; padding:10px; background:#332b1e; border-radius:5px; border-left:4px solid var(--hint);"></div>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
            <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); flex:1;">💡 ヒント</button>
            <button onclick="generateNext(false)" style="background:var(--ai); color:white; flex:1.5;">✨ 指定偏差値の類題</button>
            <button onclick="generateNext(false, true)" style="background:var(--hard); color:white; flex:1.5;">🔥 最難関へ</button>
        </div>
    </div>

    <div class="card">
        <button onclick="document.getElementById('c-input').click()" style="background:var(--success); color:white;">📸 答案を撮影・選択</button>
        <div id="preview-area" class="preview-box">
            <img id="ans-preview" src="">
            <div id="crop-overlay" class="crop-overlay">
                <div class="crop-handle tl" data-handle="tl"></div>
                <div class="crop-handle tr" data-handle="tr"></div>
                <div class="crop-handle bl" data-handle="bl"></div>
                <div class="crop-handle br" data-handle="br"></div>
            </div>
        </div>
        <div id="edit-tools" style="display:none; justify-content:center; gap:10px; margin:10px 0;">
            <button onclick="rotateImg()" style="background:#444; color:#fff; padding:5px 12px; border-radius:4px;">↻ 回転</button>
            <button onclick="resetImg()" style="background:#444; color:#fff; padding:5px 12px; border-radius:4px;">リセット</button>
        </div>
        <button id="ans-grade-btn" style="background:#f39c12; color:white; display:none;" onclick="executeGrading()">✅ 枠内を採点する</button>
        <button id="ans-toggle-btn" style="background:#555; color:white;" onclick="peekAnswer()">🔍 解答を確認</button>
        <input type="file" id="c-input" accept="image/*" capture="environment" style="display:none">
        <div id="res-box" style="background:#111; padding:15px; border-radius:8px; display:none; border-left:4px solid var(--primary); margin-top:10px;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>演習履歴</h1><button onclick="resetData()" style="background:none; border:none; color:#888; font-size:0.7rem; width:auto;">リセット</button></div>
        <div id="hist-list"></div>
    </div>

    <div id="status-ui" class="loading-overlay">
        <div id="timer" style="font-size:2.2rem; color:var(--ai); font-family:monospace; margin-bottom:10px;">0.0s</div>
        <p id="msg" style="font-weight:bold; color:#fff; font-size:1.1rem;"></p>
        <div style="font-size:0.75rem; color:#ffadad; margin-top:10px;">※高品質な解析のため最大1分程かかる場合があります</div>
        <button onclick="location.reload()" style="background:#444; color:#ccc; padding:10px; border-radius:8px; margin-top:15px; width:60%;">中断</button>
    </div>

    <script>
        let imgState = { rot: 0, scale: 1, px: 0, py: 0 };
        let cropState = { x: 50, y: 50, w: 200, h: 150, dragging: false, handling: null, sX: 0, sY: 0 };
        let appState = { prob: {}, seen: false, ans: null, unit: "数と式", currentLv: 60.0, t: null };

        const ov = document.getElementById('crop-overlay');
        const pbox = document.getElementById('preview-area');
        const img = document.getElementById('ans-preview');

        function updateTargetLabel(val) {
            let s = "[標準]";
            if (val >= 76) s = "[筑駒]"; 
            else if (val >= 72) s = "[開成]"; 
            else if (val >= 70) s = "[渋幕]"; 
            else if (val >= 68) s = "[慶応志木・筑付]"; 
            else if (val >= 66) s = "[早大学院・慶應義塾]";
            else if (val >= 64) s = "[学芸・早実・本庄]"; 
            else if (val >= 60) s = "[日比谷]"; 
            else if (val >= 56) s = "[西]";
            document.getElementById('target-school').innerText = s;
            document.getElementById('dev-val').innerText = val.toFixed(1);
        }

        function cleanMathText(txt) {
            if (!txt) return "";
            return txt.trim().replace(/[+\-*\/=]\s*\$$/, " $");
        }

        // 数式描画完了を待ってから表示する
        async function safeMathRender() {
            if (window.MathJax && MathJax.typesetPromise) {
                document.getElementById('math-content-area').style.visibility = 'hidden';
                document.getElementById('typing-msg').style.display = 'block';
                
                await MathJax.typesetPromise();
                
                document.getElementById('typing-msg').style.display = 'none';
                document.getElementById('math-content-area').style.visibility = 'visible';
            }
        }

        function initCrop() { cropState.x = 50; cropState.y = 50; cropState.w = pbox.clientWidth-100; cropState.h = 150; ov.style.display = 'block'; updateCropUI(); }
        function updateCropUI() { ov.style.left = cropState.x + 'px'; ov.style.top = cropState.y + 'px'; ov.style.width = cropState.w + 'px'; ov.style.height = cropState.h + 'px'; }
        
        pbox.addEventListener('mousedown', startDrag);
        pbox.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, {passive: false});
        window.addEventListener('mouseup', () => cropState.dragging = false);
        window.addEventListener('touchend', () => cropState.dragging = false);

        function startDrag(e) {
            const pos = getPos(e);
            if (e.target.classList.contains('crop-handle')) { cropState.handling = e.target.dataset.handle; cropState.dragging = true; }
            else if (e.target === ov) { cropState.handling = 'move'; cropState.dragging = true; }
            else return;
            e.preventDefault(); cropState.sX = pos.x; cropState.sY = pos.y;
        }

        function drag(e) {
            if (!cropState.dragging) return;
            e.preventDefault();
            const pos = getPos(e); const dX = pos.x - cropState.sX; const dY = pos.y - cropState.sY;
            if (cropState.handling === 'move') { cropState.x += dX; cropState.y += dY; }
            else {
                if (cropState.handling.includes('r')) cropState.w += dX;
                if (cropState.handling.includes('l')) { cropState.x += dX; cropState.w -= dX; }
                if (cropState.handling.includes('b')) cropState.h += dY;
                if (cropState.handling.includes('t')) { cropState.y += dY; cropState.h -= dY; }
            }
            cropState.sX = pos.x; cropState.sY = pos.y; updateCropUI();
        }

        function getPos(e) { const rect = pbox.getBoundingClientRect(); return { x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top }; }

        function getCroppedData() {
            const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
            const ratio = Math.max(img.naturalWidth / img.clientWidth, img.naturalHeight / img.clientHeight);
            const sw = cropState.w * ratio; const sh = cropState.h * ratio;
            const sx = (cropState.x - (pbox.clientWidth - img.naturalWidth / ratio) / 2) * ratio;
            const sy = (cropState.y - (pbox.clientHeight - img.naturalHeight / ratio) / 2) * ratio;
            canvas.width = sw; canvas.height = sh;
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
            return canvas.toDataURL('image/jpeg', 0.8);
        }

        document.getElementById('c-input').onchange = (e) => {
            const file = e.target.files[0]; if (!file) return;
            img.src = URL.createObjectURL(file);
            img.onload = () => { pbox.style.display = 'block'; document.getElementById('edit-tools').style.display = 'flex'; document.getElementById('ans-grade-btn').style.display = 'block'; resetImg(); initCrop(); };
        };

        function rotateImg() { imgState.rot = (imgState.rot + 90) % 360; img.style.transform = `rotate(${imgState.rot}deg)`; initCrop(); }
        function resetImg() { imgState.rot = 0; img.style.transform = ''; initCrop(); }

        async function executeGrading() {
            showUI("答案を詳細解析中...");
            const data = getCroppedData();
            try {
                const res = await fetch(`/api/chat`, { method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [
                        { text: `あなたは厳格な数学採点官。個人名は呼ぶな。筆跡がない画像は Score: 0。正解・不正解を日本語で詳しく解説せよ。※AI採点のため誤差あり。問題：${appState.prob.text}` }, 
                        { inlineData: { mimeType: "image/jpeg", data: data.split(',')[1] } }
                    ] }] })
                });
                const responseData = await res.json();
                const fb = responseData.candidates[0].content.parts[0].text;
                const box = document.getElementById('res-box');
                box.innerHTML = cleanMathText(fb);
                box.style.display = 'block';
                document.getElementById('ans-toggle-btn').innerText = "🔍 解答を閉じる";
                appState.seen = true; 
                saveLog(parseInt((fb.match(/Score:\s*(\d+)/i)||[0,0])[1]));
                safeMathRender();
                hideUI();
            } catch(e) { alert("採点エラー"); hideUI(); }
        }

        function applyProb(p, lv) {
            appState.prob = p; appState.seen = false; appState.ans = null; appState.currentLv = lv;
            document.getElementById('u-title').innerText = appState.unit;
            document.getElementById('prob-lv').innerText = `Lv.${lv.toFixed(1)}`;
            document.getElementById('p-text').innerText = cleanMathText(p.text);
            const subs = (Array.isArray(p.sub) ? p.sub : [p.sub]).filter(q => q);
            document.getElementById('q-list').innerHTML = subs.map((q, i) => `<li>(${i+1}) ${cleanMathText(q)}</li>`).join('');
            document.getElementById('h-box').innerText = cleanMathText(p.hint || "ヒントなし");
            document.getElementById('h-box').style.display = 'none'; document.getElementById('res-box').style.display = 'none';
            document.getElementById('ans-toggle-btn').innerText = "🔍 解答を確認";

            const showDiagram = /平面図形|関数|立体|相似|グラフ/.test(appState.unit) || /円|三角形|座標|辺/.test(p.text);
            document.getElementById('canvas-box').style.display = showDiagram ? 'block' : 'none';
            if (showDiagram) startDrawing(p.text);

            safeMathRender(); // 待機表示付き描画
            setTimeout(prefetchAnswer, 2000);
            hideUI();
        }

        async function generateNext(isOther = false, isHardMode = false) {
            let d = isHardMode ? 76 : parseFloat(document.getElementById('dev-slider').value);
            if (isOther) { const units = ["数と式", "方程式", "関数", "平面図形", "空間図形", "確率"]; appState.unit = units.filter(u => u !== appState.unit)[Math.floor(Math.random() * 5)]; }
            showUI(`${appState.unit} 作問中...`);
            try {
                const res = await fetch(`/api/chat`, { method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `数学作問。高校入試数学範囲限定。微積分禁止。単元「${appState.unit}」、偏差値${d}。JSON形式(text, sub:[], hint)。` }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const data = await res.json();
                applyProb(JSON.parse(data.candidates[0].content.parts[0].text), d);
            } catch (e) { alert("生成エラー"); hideUI(); }
        }

        function startDrawing(text) { 
            document.getElementById('svg-layer').innerHTML = `<div style="color:var(--ai); font-size:0.8rem;">図解生成中...</div>`;
            autoDraw(text); 
        }

        async function autoDraw(t) { 
            try { 
                const res = await fetch(`/api/chat`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ contents: [{ parts: [{ text: `問題「${t}」を可視化した数学的なSVGタグのみ。` }] }] }) }); 
                const data = await res.json(); 
                const svg = data.candidates[0].content.parts[0].text.match(/<svg[\s\S]*?<\/svg>/i);
                if (svg) {
                    document.getElementById('svg-layer').innerHTML = svg[0];
                    safeMathRender();
                }
            } catch (e) {} 
        }

        async function prefetchAnswer() { 
            try { 
                const res = await fetch(`/api/chat`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ contents: [{ parts: [{ text: `解答全解。数式は$囲み。問題：${appState.prob.text}` }] }] }) }); 
                const data = await res.json();
                appState.ans = cleanMathText(data.candidates[0].content.parts[0].text); 
            } catch (e) {} 
        }

        async function peekAnswer() {
            const box = document.getElementById('res-box'); const btn = document.getElementById('ans-toggle-btn');
            if (box.style.display === 'block') { box.style.display = 'none'; btn.innerText = "🔍 解答を確認"; return; }
            if (!appState.seen) { 
                if (!confirm("未採点のため偏差値加算は行われませんが、解答を表示しますか？")) return; 
                appState.seen = true; saveLog(0); 
            }
            if (!appState.ans) { btn.innerText = "⏳ 取得中..."; await prefetchAnswer(); }
            box.innerHTML = appState.ans || "解答取得エラー"; box.style.display = 'block'; btn.innerText = "🔍 解答を閉じる";
            safeMathRender();
        }

        function toggleHint() { const b = document.getElementById('h-box'); b.style.display = (b.style.display==='block')?'none':'block'; safeMathRender(); }
        
        function showUI(m) { 
            document.getElementById('status-ui').style.display='block'; 
            document.getElementById('msg').innerText=m; 
            let s = Date.now(); clearInterval(appState.t); appState.t = setInterval(()=>{ document.getElementById('timer').innerText=((Date.now()-s)/1000).toFixed(1)+"s"; },100); 
        }
        function hideUI() { document.getElementById('status-ui').style.display='none'; clearInterval(appState.t); }
        function doSkip() { generateNext(true); }
        function resetData() { if(confirm("リセット？")) { localStorage.clear(); location.reload(); } }

        function refreshStats() {
            const h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            document.getElementById('hist-list').innerHTML = h.slice(0,10).map(x => `
                <div class="history-item">
                    <div class="hist-info">
                        <span class="hist-date">${x.dt} (${x.lv || "---"})</span>
                        <span>${x.u}</span>
                    </div>
                    <span class="score-badge">${x.s}/10</span>
                </div>`).join('');
            if(h.length > 0) { const avg = h.map(x => x.s).reduce((a,b)=>a+b,0) / h.length; const d = Math.max(45, Math.min(80, 40 + (avg * 3.5))); document.getElementById('dev-slider').value = d; updateTargetLabel(d); }
        }
        function saveLog(s) {
            let h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            const now = new Date(); const dt = (now.getMonth()+1) + "/" + now.getDate();
            h.unshift({ u: appState.unit, s: s, dt: dt, lv: appState.currentLv.toFixed(1) });
            localStorage.setItem('m_hist', JSON.stringify(h.slice(0, 50))); refreshStats();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const slider = document.getElementById('dev-slider');
            slider.oninput = (e) => updateTargetLabel(parseFloat(e.target.value));
            refreshStats();
            applyProb({ text: "次の方程式を解け。$2(x-3) = \\frac{x}{2} + 1$", sub: ["xを求めよ。"], hint: "整理して解け。" }, 60.0);
        });
    </script>
</body>
</html>
