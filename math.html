<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>最難関突破 AI数学講師 v3.3.0</title>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            options: { enableMenu: false },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    startMathObserver();
                }
            }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; --hard: #e74c3c; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.6; font-size: 14px; overflow-x: hidden; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; position: relative; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .debug-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        
        /* スライダー調整 */
        .dev-control-box { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
        .dev-display-row { display: flex; align-items: baseline; gap: 10px; }
        #dev-slider { width: 100%; height: 6px; border-radius: 5px; background: #444; outline: none; -webkit-appearance: none; margin: 10px 0; }
        #dev-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); cursor: pointer; }

        .canvas-container { background: #ffffff; border-radius: 6px; height: 260px; margin-bottom: 5px; overflow: hidden; position: relative; border: 2px solid #333; display: flex; align-items: center; justify-content: center; }
        #svg-layer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: 0 0; transition: transform 0.05s ease-out; cursor: grab; flex-direction: column; color: #444; font-size: 0.8rem; }
        .stat-val { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
        .target-label { font-size: 0.9rem; color: var(--hint); font-weight: bold; }
        
        .btn-redraw { position: absolute; right: 10px; top: 50px; background: #444; color: #fff; border: 1px solid #666; padding: 3px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; z-index: 10; font-weight: bold; }
        #p-text, #q-list li, #h-box, #res-box { white-space: pre-wrap; word-break: break-word; }
        .loading-overlay { display: none; text-align: center; padding: 25px; background: rgba(0,0,0,0.98); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 15%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.85rem; margin-bottom: 8px; }
        .btn-ai-gen { background: var(--ai); color: white; }
        .btn-camera { background: var(--success); color: white; flex: 1; }
        .btn-answer-only { background: #555; color: white; flex: 1; }
        .canvas-footer { font-weight: bold; font-size: 0.75rem; text-align: center; line-height: 1.4; margin-bottom: 10px; }
        .text-alert { color: #ffadad; }
        .text-dim { color: #888; font-weight: normal; font-size: 0.65rem; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #444; font-size: 0.8rem; cursor: pointer; }
        .score-badge { background: #444; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="debug-bar">
        <label><input type="checkbox" id="debug-mode"> DEBUG</label>
        <span class="version-tag">ver 3.3.0 Slider-Sync</span>
    </div>

    <div class="card">
        <div class="header-flex"><h1>分析パネル</h1></div>
        <div style="display:flex; flex-direction:column; align-items:center;">
            <div class="dev-control-box">
                <div class="dev-display-row">
                    <span id="dev-val" class="stat-val">50.0</span>
                    <span id="target-school" class="target-label">[都立中堅]</span>
                </div>
                <input type="range" id="dev-slider" min="30" max="80" step="0.5" value="50">
            </div>
            <div style="width:100%; display:flex; justify-content:space-around; border-top:1px solid #444; padding-top:10px; margin-top:5px;">
                <div><div style="font-size:0.65rem; color:#aaa;">累計演習</div><div id="count-val" class="stat-val" style="font-size:1.2rem;">0</div></div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>試験問題 [<span id="u-title"></span>]</h1>
            <button onclick="doSkip()" style="background:var(--skip); color:white; border:none; border-radius:4px; padding:6px 12px; font-size:0.85rem; width:auto;">他領域へ ≫</button>
        </div>
        <div class="btn-redraw" onclick="safeRender()">↻ 再描画</div>
        <div class="canvas-container" id="zoom-box"><div id="svg-layer"></div></div>
        
        <div id="canvas-footer" class="canvas-footer" style="display:none;">
            <div class="text-alert">※高品質な構成のため最大1分程かかる場合があります</div>
            <div class="text-dim">※図は必ずしも正確ではありません（移動・拡大可）</div>
        </div>

        <div id="math-content-area">
            <p id="p-text" style="font-weight:bold; margin: 8px 0; color: #ccc; border-bottom: 1px dashed #444; padding-bottom: 8px;"></p>
            <ul id="q-list" style="padding-left: 20px; margin: 12px 0; list-style:none;"></ul>
            <div id="h-box" style="display:none; color:var(--hint); font-size:0.85rem; padding:10px; background:#332b1e; border-radius:5px; margin:10px 0; border-left:4px solid var(--hint);"></div>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:6px; font-size:0.8rem; flex:1;">💡 助言を表示</button>
            <button class="btn-ai-gen" onclick="generateNext(false)" style="flex:1.5;">✨ 類題作成</button>
            <button class="btn-hard" onclick="generateNext(false, true)" style="background:var(--hard); color:white; flex:1.5;">🔥 最難関へ</button>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; gap:10px;">
            <button class="btn-camera" onclick="document.getElementById('c-input').click()">📸 撮影して採点</button>
            <button class="btn-answer-only" onclick="peekAnswer()">🔍 解答を確認</button>
        </div>
        <input type="file" id="c-input" accept="image/*" capture="environment" style="display:none">
        <div id="res-box" style="background:#111; padding:15px; border-radius:8px; display:none; border-left:4px solid var(--primary); margin-top:10px; font-size:0.85rem;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>復習リスト</h1><button onclick="resetData()" style="background:none; border:none; color:#888; font-size:0.7rem; width:auto;">リセット</button></div>
        <div id="hist-list"></div>
    </div>

    <div id="status-ui" class="loading-overlay">
        <div id="timer" style="font-size:2.2rem; color:var(--ai); font-family:monospace; margin-bottom:10px;">0.0s</div>
        <p id="msg" style="font-weight:bold; color:#fff; font-size:1.1rem;"></p>
        <div class="canvas-footer" style="margin-top:15px;">
            <div class="text-alert">※高品質な構成のため最大1分程かかる場合があります。</div>
            <div style="color:#888; font-size:0.7rem; font-weight:normal;">AIが思考を完結させるまでお待ちください。</div>
        </div>
        <button onclick="abortGeneration()" style="background:#444; color:#ccc; padding:10px; border-radius:8px; border:none; margin-top:15px; width:60%;">中断</button>
    </div>

    <script>
        let currentAbortController = null, drawingAbortController = null, drawingLock = false;
        let isRendering = false;
        let state = { prob: {}, scale: 1, x: 0, y: 0, t: null, dt: null, seen_answer: false, prefetched_answer: null, last_units: [], current_target_unit: "数と式" };

        function startMathObserver() {
            const observer = new MutationObserver(() => { if (!isRendering) safeRender(); });
            observer.observe(document.getElementById('math-content-area'), { childList: true, subtree: true });
            observer.observe(document.getElementById('res-box'), { childList: true, subtree: true });
        }

        async function safeRender() {
            if (isRendering || !window.MathJax || !MathJax.typesetPromise) return;
            isRendering = true;
            try { await MathJax.typesetPromise(); } catch (e) { }
            finally { setTimeout(() => { isRendering = false; }, 100); }
        }

        window.onload = () => {
            initZoom(); refreshStats();
            
            // スライダーイベントの初期化
            const slider = document.getElementById('dev-slider');
            const devVal = document.getElementById('dev-val');
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                devVal.innerText = val.toFixed(1);
                updateTargetSchool(val);
            });

            applyProb({ unit: "数と式", text: "次の等式において、$x$ の値を求めよ。", sub: ["$2(x-3) = \\frac{x}{2} + 1$"], hint: "分母を払うために、両辺を2倍せよ。" });
            setTimeout(safeRender, 500);
        };

        function updateTargetSchool(dev) {
            let s = "[都立中堅]";
            if (dev >= 72) s = "[筑駒]"; else if (dev >= 68) s = "[開成]"; else if (dev >= 62) s = "[日比谷]"; else if (dev >= 55) s = "[上位校]";
            document.getElementById('target-school').innerText = s;
        }

        function cleanText(t, index = null) {
            if (!t) return "";
            let s = (typeof t === 'object') ? (t.text || t.problem || t.body || t.question || JSON.stringify(t)) : String(t);
            if (s.includes('{') && s.includes('}')) { try { const m = s.match(/\{[\s\S]*\}/); if (m) { const p = JSON.parse(m[0]); s = p.question_text || p.text || p.problem || s; } } catch(e) {} }
            if (index === null) s = s.replace(/^[\s\S]*?(ヒント|解説|解答)：?/g, "").replace(/^\(\d+\)\s*/, "");
            s = s.replace(/riangle/g, "\\triangle ").replace(/\\triangle(?![ \s])/g, "\\triangle ");
            if (!s.includes('$')) s = s.replace(/([a-z]\s*[=<>]\s*[^ 　\n。]+|[a-z]\^\d+|[A-Z]\([^\)]+\)|\\frac\{[^\}]+\}\{[^\}]+\})/gi, '$$$1$$');
            if ((s.match(/\$/g) || []).length % 2 !== 0) s += "$";
            if (index !== null) { s = s.replace(/^\(\d+\)\s*/, ""); s = `(${index}) ` + s.trim(); }
            return s.trim();
        }

        function applyProb(p) {
            if (!p) return false;
            const mainText = cleanText(p.text || p.problem || p.body);
            if (!mainText || mainText.length < 5) return false;
            state.prob = p; state.seen_answer = false; state.prefetched_answer = null; resetView();
            const unitToUse = p.unit_lock || state.current_target_unit || p.unit || "総合";
            state.current_target_unit = unitToUse;
            document.getElementById('u-title').innerText = unitToUse;
            document.getElementById('p-text').innerText = mainText;
            const rawSub = p.sub || p.questions || p.q || [];
            let subArray = (Array.isArray(rawSub) ? rawSub : [rawSub]).filter(q => q && String(q).length > 0);
            if (subArray.length === 0 || (subArray.length === 1 && subArray[0].length < 5)) {
                const lastSentence = mainText.split(/[。？]/).filter(s => s.length > 0).pop();
                if (lastSentence && (lastSentence.includes("求めよ") || lastSentence.includes("証明せよ"))) subArray = [lastSentence + "。"];
                else subArray = ["与えられた条件に従い答えを導け。"];
            }
            document.getElementById('q-list').innerHTML = subArray.map((q, i) => `<li>${cleanText(q, i+1)}</li>`).join('');
            document.getElementById('h-box').innerText = cleanText(p.hint || p.explanation) || "数理的構造を分析せよ。";
            document.getElementById('h-box').style.display = 'none'; document.getElementById('res-box').style.display = 'none';
            const drawKeywords = /三角形|四角形|円|相似|合同|平行|垂直|線分|中点|関数|グラフ|座標|直線|曲線|放物線|立体|見取り図|展開図|三平方|ピタゴラス/;
            const showDiagram = p.has_diagram || /平面図形|幾何|関数|立体|空間/.test(state.current_target_unit) || drawKeywords.test(mainText);
            document.getElementById('zoom-box').style.display = showDiagram ? 'flex' : 'none';
            document.getElementById('canvas-footer').style.display = showDiagram ? 'block' : 'none';
            if (showDiagram) {
                document.getElementById('svg-layer').innerHTML = `<div style="color:#444; font-weight:bold;">🎨 作図中...</div>`;
                setTimeout(() => autoDraw(0, mainText), 100);
            }
            safeRender(); prefetchAnswer();
            return true;
        }

        async function autoDraw(retry = 0, sourceText) {
            if (drawingLock || retry > 2) return;
            drawingLock = true; drawingAbortController = new AbortController();
            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"}, signal: drawingAbortController.signal,
                    body: JSON.stringify({ contents: [{ parts: [{ text: `問題「${sourceText}」の可視化SVG。点名と数値のみ。日本語禁止。` }] }] })
                });
                let svg = (await res.json()).candidates[0].content.parts[0].text.match(/<svg[\s\S]*?<\/svg>/i);
                if (svg) {
                    let cleanSvg = svg[0].replace(/<text(.*?)>(.*?)<\/text>/gi, (m, p1, p2) => {
                        const content = p2.replace(/\$|\\/g, '').trim();
                        if (content.length === 1 && /[A-Za-z]/.test(content)) return sourceText.includes(content) ? `<text${p1}>${content}</text>` : '';
                        return /^\d+(\.\d+)?(°|度)?$/.test(content) ? `<text${p1}>${content}</text>` : '';
                    });
                    document.getElementById('svg-layer').innerHTML = cleanSvg;
                }
            } catch (e) { if (e.name !== 'AbortError') setTimeout(() => { drawingLock = false; autoDraw(retry + 1, sourceText); }, 500); }
            finally { drawingLock = false; drawingAbortController = null; }
        }

        async function generateNext(isOther = false, isHardMode = false, retryCount = 0) {
            if (retryCount === 0) { if (drawingAbortController) drawingAbortController.abort(); drawingLock = false; }
            let devValue = isHardMode ? 80 : (parseFloat(document.getElementById('dev-val').innerText) || 50.0);
            let target = isOther ? (()=>{
                const allUnits = ["数と式", "方程式", "関数", "平面図形", "空間図形", "確率", "データの活用"];
                const pool = allUnits.filter(u => !state.last_units.includes(u));
                const res = pool[Math.floor(Math.random() * pool.length)];
                state.last_units.push(res); if(state.last_units.length > 3) state.last_units.shift();
                return res;
            })() : state.current_target_unit;
            state.current_target_unit = target;
            showUI(`${target}${isHardMode ? 'の最難関問' : ''}を構成中...${retryCount > 0 ? '(再試行中)' : ''}`);
            currentAbortController = new AbortController();
            const prompt = `あなたは難関入試の「数学作問委員」です。
【使命】受験生の思考力を測定する問題を構成せよ。
【絶対遵守：口調】「～を求めよ」「～を証明せよ」という入試問題調のみ。
【形式】単元「${target}」、偏差値${devValue}レベル。JSON(text, sub:[], hint)形式。`;
            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"}, signal: currentAbortController.signal,
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const parsed = JSON.parse((await res.json()).candidates[0].content.parts[0].text);
                parsed.unit_lock = target;
                if (!applyProb(parsed)) throw new Error("Invalid");
                hideUI();
            } catch (e) {
                if (retryCount < 3 && e.name !== 'AbortError') generateNext(isOther, isHardMode, retryCount + 1);
                else { hideUI(); if (retryCount >= 3) alert("問題構成失敗。"); }
            }
        }

        function initZoom() {
            const container = document.getElementById('zoom-box');
            let isDrag = false, sx, sy;
            container.onmousedown = (e) => { isDrag = true; sx = e.clientX - state.x; sy = e.clientY - state.y; };
            window.onmousemove = (e) => { if (!isDrag) return; state.x = e.clientX - sx; state.y = e.clientY - sy; updateView(); };
            window.onmouseup = () => isDrag = false;
            container.addEventListener('wheel', (e) => { e.preventDefault(); state.scale = Math.min(Math.max(0.5, state.scale * (e.deltaY > 0 ? 0.9 : 1.1)), 5); updateView(); }, { passive: false });
        }
        function updateView() { document.getElementById('svg-layer').style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`; }
        function resetView() { state.scale = 1; state.x = 0; state.y = 0; updateView(); }
        function toggleHint() { const b = document.getElementById('h-box'); b.style.display = (b.style.display==='block')?'none':'block'; if(b.style.display==='block') safeRender(); }
        function showUI(m) { document.getElementById('status-ui').style.display='block'; document.getElementById('msg').innerText=m; let s=Date.now(); clearInterval(state.t); state.t=setInterval(()=>{document.getElementById('timer').innerText=((Date.now()-s)/1000).toFixed(1)+"s";},100); }
        function hideUI() { document.getElementById('status-ui').style.display='none'; clearInterval(state.t); }
        function abortGeneration() { if (currentAbortController) currentAbortController.abort(); hideUI(); }
        async function prefetchAnswer() { try { const res = await fetch(`/api/chat`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ contents: [{ parts: [{ text: `入試解答。問題：${state.prob.text||state.prob.problem}` }] }] }) }); state.prefetched_answer = cleanText((await res.json()).candidates[0].content.parts[0].text); } catch (e) {} }
        function peekAnswer() { 
            if (state.seen_answer) return;
            if (!confirm("解答を確認すると本問は0点(不正解)として記録される。よろしいか？")) return; 
            state.seen_answer = true; document.getElementById('res-box').innerHTML = state.prefetched_answer || "取得失敗。"; 
            document.getElementById('res-box').style.display = 'block'; saveLog("×", 0); 
        }
        function loadHist(i) { applyProb(JSON.parse(localStorage.getItem('m_hist'))[i].p); }
        function doSkip() { generateNext(true); }
        function resetData() { if(confirm("消去？")) { localStorage.clear(); location.reload(); } }
        function refreshStats() { 
            const h = JSON.parse(localStorage.getItem('m_hist') || "[]"); 
            document.getElementById('count-val').innerText = h.length; 
            document.getElementById('hist-list').innerHTML = h.slice(0,10).map((x, i) => `<div class="history-item" onclick="loadHist(${i})"><span>${x.d} ${x.u}</span><div><span class="score-badge">${x.s}/10</span></div></div>`).join('');
            if(h.length > 0) {
                const avgScore = h.map(x => x.s).reduce((a,b)=>a+b,0)/h.length;
                const autoDev = 40 + (avgScore * 3.5);
                // スライダーと連動
                document.getElementById('dev-slider').value = autoDev;
                document.getElementById('dev-val').innerText = autoDev.toFixed(1);
                updateTargetSchool(autoDev);
            }
        }
        function saveLog(mark, score) {
            let h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            const probToSave = JSON.parse(JSON.stringify(state.prob));
            probToSave.unit = state.current_target_unit;
            h.unshift({ d: new Date().toLocaleDateString(), u: state.current_target_unit, m: mark, s: score, p: probToSave });
            localStorage.setItem('m_hist', JSON.stringify(h.slice(0, 30))); refreshStats();
        }
        document.getElementById('c-input').onchange = (e) => {
            if (state.seen_answer) return; showUI("採点中...");
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const res = await fetch(`/api/chat`, { method: "POST", headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ contents: [{ parts: [{ text: `入試採点官。Score: X/10。問題：${state.prob.text}` }, { inlineData: { mimeType: e.target.files[0].type, data: ev.target.result.split(',')[1] } }] }] })
                    });
                    const fb = cleanText((await res.json()).candidates[0].content.parts[0].text);
                    document.getElementById('res-box').innerHTML = fb; document.getElementById('res-box').style.display = 'block';
                    saveLog(fb.includes("Score: 10") ? "○" : "×", parseInt((fb.match(/Score:\s*(\d+)/i)||[0,0])[1]));
                } finally { hideUI(); }
            };
            reader.readAsDataURL(e.target.files[0]);
        };
    </script>
</body>
</html>
