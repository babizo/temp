<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>最難関突破 AI数学講師 v2.1.7</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: { typeset: false }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.5; font-size: 14px; overflow-x: hidden; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .version-tag { font-size: 0.6rem; color: #888; font-family: monospace; background: #333; padding: 2px 6px; border-radius: 4px;}
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-box { background: #333; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 0.7rem; color: #aaa; }
        .stat-val { font-size: 1.3rem; font-weight: bold; color: var(--primary); }
        .unit-analysis { font-size: 0.8rem; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px; }
        .unit-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .unit-bar-bg { background: #444; height: 6px; width: 100%; border-radius: 3px; margin-top: 2px; overflow: hidden; }
        .unit-bar-fill { background: var(--success); height: 100%; transition: 0.5s; }
        .canvas-container { background: #ffffff; border-radius: 6px; height: 260px; margin-bottom: 10px; overflow: hidden; position: relative; touch-action: none; display: flex; align-items: center; justify-content: center; border: 2px solid #333; text-align: center; }
        #svg-layer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: 0 0; color: #444; font-size: 0.8rem; flex-direction: column; }
        svg { width: 100%; height: 100%; display: block; }
        #p-text, #q-list li, #h-box, #res-box { white-space: pre-wrap; word-break: break-word; }
        .loading-overlay { display: none; text-align: center; padding: 15px; background: rgba(0,0,0,0.95); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 8px; transition: 0.2s; }
        .btn-ai-gen { background: var(--ai); color: white; font-size: 0.9rem; }
        .btn-camera { background: var(--success); color: white; height: 52px; }
        .hint-box { display: none; color: var(--hint); font-weight: bold; padding: 12px; border-left: 4px solid var(--hint); font-size: 0.85rem; background: rgba(243, 156, 18, 0.08); margin: 10px 0; border-radius: 0 8px 8px 0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #444; font-size: 0.8rem; cursor: pointer; }
        .score-badge { background: #444; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .adaptive-badge { background: #e67e22; color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; margin-left: 5px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="header-flex" style="margin-top: 5px; border-bottom: none;">
        <h1 style="color: #aaa; font-size: 0.9rem;">塾生用演習システム</h1>
        <span class="version-tag">ver 2.1.7 Format-Fix</span>
    </div>

    <div class="card">
        <div class="header-flex"><h1>分析パネル</h1><span style="font-size:0.6rem; color:#888;">SAPIX偏差値準拠</span></div>
        <div style="display:flex; justify-content:space-around; text-align:center;">
            <div>
                <div style="font-size:0.7rem; color:#aaa;">想定偏差値</div>
                <div style="display:flex; align-items:baseline; justify-content:center; gap:5px; flex-wrap:wrap;">
                    <span id="dev-val" style="font-size:1.5rem; font-weight:bold; color:var(--primary);">50.0</span>
                    <span id="target-school" style="font-size:0.75rem; color:var(--hint); font-weight:bold;">[都立中堅]</span>
                </div>
            </div>
            <div><div style="font-size:0.7rem; color:#aaa;">累計演習</div><div id="count-val" style="font-size:1.5rem; font-weight:bold; color:var(--primary);">0</div></div>
        </div>
        <div id="unit-chart" style="margin-top:10px; font-size:0.8rem;"></div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>演習 [<span id="u-title"></span>]<span id="adaptive-label" class="adaptive-badge" style="display:none;">レベル調整済</span></h1>
            <button onclick="doSkip()" style="background:var(--skip); color:white; border:none; border-radius:4px; padding:4px 10px; font-size:0.7rem; width:auto;">他の単元へ ≫</button>
        </div>
        <div class="canvas-container" id="zoom-box"><div id="svg-layer"></div></div>
        <div id="math-content-area">
            <p id="p-text" style="font-weight:bold; margin: 8px 0; color: #ccc; border-bottom: 1px dashed #444; padding-bottom: 8px;"></p>
            <ul id="q-list" style="padding-left: 20px; margin: 12px 0;"></ul>
            <div id="h-box" class="hint-box"></div>
        </div>
        <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:6px; width:auto; font-size:0.8rem;">💡 ヒント</button>
        <button class="btn-ai-gen" onclick="generateNext(false)">✨ 現在の偏差値で類題を作成</button>
    </div>

    <div class="card">
        <button class="btn-camera" onclick="document.getElementById('c-input').click()">📸 解答を撮影して採点</button>
        <input type="file" id="c-input" accept="image/*" capture="environment" style="display:none">
        <div id="res-box" style="background:#111; padding:15px; border-radius:8px; display:none; border-left:4px solid var(--primary); white-space:pre-wrap; font-size:0.85rem; margin-top:10px;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>復習リスト</h1><button onclick="resetData()" style="background:none; border:none; color:#888; font-size:0.7rem; width:auto;">リセット</button></div>
        <div id="hist-list"></div>
    </div>

    <div id="status-ui" class="loading-overlay">
        <div id="timer" style="font-size:1.5rem; color:var(--ai); font-family:monospace;">0.0s</div>
        <p id="msg"></p>
    </div>

    <script>
        let state = { prob: {}, scale: 1, x: 0, y: 0, t: null, graded: false };

        // 【修正】初期データの text を「前提条件のみ」に統一し、問いを sub にまとめた
        const initDataList = [
            {
                unit: "数と式（循環小数）",
                text: "分数 $\\frac{5}{13}$ を小数で表したとき、小数第 $n$ 位の数字を $f(n)$ とする。",
                sub: ["(1) $f(100)$ の値を求めよ。", "(2) $f(1) + f(2) + \\dots + f(60)$ の値を求めよ。"],
                has_diagram: false,
                hint: "実際に割り算を行い、循環節（繰り返しの周期）を見つけましょう。"
            },
            {
                unit: "整数問題",
                text: "自然数 $n$ について、式 $P = n^2 - 12n + 27$ を考える。",
                sub: ["(1) 式 $P$ を因数分解せよ。", "(2) $P$ が素数となるような自然数 $n$ をすべて求めよ。"],
                has_diagram: false,
                hint: "$P$ が素数となるには、因数のどちらかが $1$ か $-1$ になる必要があります。"
            },
            {
                unit: "方程式",
                text: "$x$ についての2次方程式 $x^2 - (a-3)x + a^2 - 4a - 5 = 0$ があり、1つの解は $x = 0$ である。",
                sub: ["(1) 定数 $a$ の値を求めよ。", "(2) 他方の解を求めよ。"],
                has_diagram: false,
                hint: "$x=0$ を方程式に代入して、$a$ についての二次方程式を解きます。"
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const randomInitProb = initDataList[Math.floor(Math.random() * initDataList.length)];
            applyProb(randomInitProb);
            refreshStats();
            initZoom();
        });

        function renderMath() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetClear();
                MathJax.typesetPromise([document.getElementById('math-content-area'), document.getElementById('res-box')]).catch(e => console.error(e));
            } else { setTimeout(renderMath, 100); }
        }

        function cleanText(t) {
            if (typeof t !== 'string') return t;
            return t.replace(/\\n/g, "\n");
        }

        function applyProb(p) {
            state.prob = p;
            state.graded = false; 
            let unitName = cleanText(p.unit) || "総合演習";
            if(unitName.match(/cm|m|kg|度/)) unitName = "図形・計量"; 
            document.getElementById('u-title').innerText = unitName;
            
            // 前提条件の表示
            const pTextElem = document.getElementById('p-text');
            pTextElem.innerText = "【前提条件】\n" + cleanText(p.text);
            
            const subItems = Array.isArray(p.sub) ? p.sub : [p.sub];
            document.getElementById('q-list').innerHTML = subItems.filter(s=>s).map(s => `<li>${cleanText(s)}</li>`).join('');
            document.getElementById('h-box').innerText = cleanText(p.hint);
            document.getElementById('h-box').style.display = 'none';
            document.getElementById('res-box').style.display = 'none';
            const canvasBox = document.getElementById('zoom-box');
            if (p.has_diagram === false) { canvasBox.style.display = 'none'; }
            else {
                canvasBox.style.display = 'flex';
                const layer = document.getElementById('svg-layer');
                if (p.svg) layer.innerHTML = p.svg;
                state.scale = 1; state.x = 0; state.y = 0; updateView();
            }
            renderMath();
        }

        function robustJSONParse(rawStr) {
            let s = rawStr;
            const startIdx = s.indexOf('{');
            const endIdx = s.lastIndexOf('}');
            if (startIdx !== -1 && endIdx !== -1) {
                s = s.substring(startIdx, endIdx + 1);
            }
            try {
                return JSON.parse(s);
            } catch (e1) {
                try {
                    s = s.replace(/\\([^"\\])/g, "\\\\$1");
                    return JSON.parse(s);
                } catch (e2) {
                    console.error("Parse Error Details:", s);
                    throw new Error("AIの応答が正しく読み取れませんでした。もう一度お試しください。");
                }
            }
        }

        async function generateNext(isOtherUnit = false) {
            const dev = parseFloat(document.getElementById('dev-val').innerText) || 50;
            let adaptive = `現在偏差値${dev}に最適化せよ。`;

            let promptText = `最難関高校講師。類題を作成。数値替え禁止。数式はLaTeX($)を使用。`;
            if (isOtherUnit) promptText = `最難関高校講師。現在の単元「${state.prob.unit}」とは異なる系統の良問を作成。`;

            showUI(`思考力を問う問題を構成中...`);
            try {
                // 【修正】AIへのプロンプトで text と sub の役割分担を厳格に指示
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: `${promptText}
                        【指示】${adaptive} 方程式は代数、確率は論理重視、循環小数も可。
                        【最重要ルール】
                        ・「text」には問題の【前提条件や状況設定のみ】を記述し、「〜を求めよ」などの問いは絶対に含めないこと。
                        ・実際の問いはすべて「sub」配列の中に「(1) 〜を求めよ」「(2) 〜を求めよ」の形式で分割して記述すること。
                        出力は以下のJSONのみを出力せよ。
                        {"unit":"単元名","text":"前提条件のみ記述","sub":["(1) ...","(2) ..."],"hint":"...", "has_diagram": true}` }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                const json = robustJSONParse(data.candidates[0].content.parts[0].text);
                applyProb(json);
                document.getElementById('adaptive-label').style.display = 'inline-block';
                hideUI();
                if (json.has_diagram !== false) autoDraw();
            } catch (e) { hideUI(); console.error(e); alert("通信失敗: " + e.message); }
        }

        async function autoDraw() {
            const layer = document.getElementById('svg-layer');
            let st = Date.now();
            let drawTimer = setInterval(() => {
                layer.innerHTML = `<div style="color:var(--ai); font-weight:bold; margin-bottom:5px;">🎨 作図中...</div><div style="font-size:1.5rem; font-family:monospace; color:#aaa;">${((Date.now()-st)/1000).toFixed(1)}s</div>`;
            }, 100);
            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: `問題「${state.prob.text}」の状況視覚化SVG。<svg>タグのみ出力。viewBox="0 0 200 200"` }] }]
                    })
                });
                const data = await res.json();
                clearInterval(drawTimer);
                if (data.error) throw new Error();
                const text = data.candidates[0].content.parts[0].text;
                const match = text.match(/<svg[\s\S]*?<\/svg>/);
                if (match) { state.prob.svg = match[0]; layer.innerHTML = match[0]; }
            } catch (e) { clearInterval(drawTimer); layer.innerHTML = "作図エラー"; }
        }

        async function doGrade(file) {
            showUI("採点中...");
            const reader = new FileReader();
            reader.onload = async (e) => {
                const b64 = e.target.result.split(',')[1];
                try {
                    const res = await fetch(`/api/chat`, {
                        method: "POST", headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ contents: [{ parts: [{ text: `最難関講師として画像採点。数式LaTeX。Score: X/10を末尾に。問題：${state.prob.text}` }, { inlineData: { mimeType: file.type || "image/jpeg", data: b64 } }] }] })
                    });
                    const data = await res.json();
                    if (data.error) throw new Error();
                    const fb = cleanText(data.candidates[0].content.parts[0].text);
                    const resBox = document.getElementById('res-box');
                    resBox.innerText = fb; resBox.style.display = 'block';
                    renderMath();
                    const score = parseInt((fb.match(/Score:\s*(\d+)/i)||[0,0])[1]);
                    saveLog(score >= 8 ? "○" : (score >= 4 ? "△" : "×"), score);
                    state.graded = true;
                } catch (e) { alert("採点失敗"); } finally { hideUI(); }
            };
            reader.readAsDataURL(file);
        }

        function saveLog(mark, score) {
            let h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            h.unshift({ d: new Date().toLocaleDateString(), u: state.prob.unit, m: mark, s: score, p: JSON.parse(JSON.stringify(state.prob)) });
            localStorage.setItem('m_hist', JSON.stringify(h.slice(0, 30)));
            refreshStats();
        }

        function refreshStats() {
            const h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            document.getElementById('count-val').innerText = h.length;
            document.getElementById('hist-list').innerHTML = h.slice(0,10).map((x, i) => `<div class="history-item" onclick="loadHist(${i})"><span>${x.d} ${x.u}</span><div><span class="score-badge">${x.s}/10</span> ${x.m}</div></div>`).join('');
            let dev = 50.0;
            if (h.length >= 1) dev = 40 + ((h.map(x => x.s).reduce((a,b)=>a+b,0)/h.length) * 3.5);
            document.getElementById('dev-val').innerText = dev.toFixed(1);
            let school = "[都立中堅]";
            if (dev >= 68) school = "[筑駒]";
            else if (dev >= 66) school = "[開成・灘]";
            else if (dev >= 64) school = "[渋幕・学芸大附]";
            else if (dev >= 62) school = "[日比谷・慶應志木・早実]";
            else if (dev >= 60) school = "[西・早大本庄・早大学院・慶應義塾]";
            else if (dev >= 58) school = "[国立・青山・立教新座]";
            else if (dev >= 56) school = "[戸山・ICU]";
            else if (dev >= 54) school = "[新宿・八王子東]";
            else if (dev >= 52) school = "[都立共通上位]";
            document.getElementById('target-school').innerText = school;
            const units = {};
            h.forEach(x => { if(!units[x.u]) units[x.u]={s:0,c:0}; units[x.u].s+=x.s; units[x.u].c++; });
            let html = "";
            for(let u in units) {
                const a = units[u].s/units[u].c;
                html += `<div style="margin-bottom:5px;"><span>${u}</span> <span style="float:right;">${a.toFixed(1)}/10</span><div style="background:#444; height:4px; width:100%;"><div style="background:var(--success); height:100%; width:${a*10}%;"></div></div></div>`;
            }
            document.getElementById('unit-chart').innerHTML = html;
        }

        function initZoom() {
            const c = document.getElementById('zoom-box');
            let isDrag = false, sx = 0, sy = 0;
            c.onwheel = (e) => { e.preventDefault(); state.scale = Math.min(Math.max(0.5, state.scale * (e.deltaY > 0 ? 0.9 : 1.1)), 5); updateView(); };
            c.onmousedown = (e) => { isDrag = true; sx = e.clientX - state.x; sy = e.clientY - state.y; };
            window.onmousemove = (e) => { if(isDrag) { state.x = e.clientX - sx; state.y = e.clientY - sy; updateView(); } };
            window.onmouseup = () => isDrag = false;
            c.ontouchstart = (e) => { if(e.touches.length === 1) { isDrag = true; sx = e.touches[0].clientX - state.x; sy = e.touches[0].clientY - state.y; } };
            c.ontouchmove = (e) => { if(e.touches.length === 1 && isDrag) { state.x = e.touches[0].clientX - sx; state.y = e.touches[0].clientY - sy; updateView(); } };
            c.ontouchend = () => isDrag = false;
        }
        function loadHist(i) { applyProb(JSON.parse(localStorage.getItem('m_hist'))[i].p); document.getElementById('adaptive-label').style.display = 'none'; }
        function doSkip() { if (!state.graded) saveLog("SKIP", 0); generateNext(true); }
        function toggleHint() { const b = document.getElementById('h-box'); b.style.display = (b.style.display === 'block') ? 'none' : 'block'; renderMath(); }
        function resetData() { if(confirm("履歴消去？")) { localStorage.clear(); location.reload(); } }
        function showUI(m) { document.getElementById('status-ui').style.display='block'; document.getElementById('msg').innerText=m; let s=Date.now(); state.t=setInterval(()=>{document.getElementById('timer').innerText=((Date.now()-s)/1000).toFixed(1)+"s";},100); }
        function hideUI() { document.getElementById('status-ui').style.display='none'; clearInterval(state.t); }
        function updateView() { document.getElementById('svg-layer').style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`; }
        document.getElementById('c-input').onchange = (e) => doGrade(e.target.files[0]);
    </script>
</body>
</html>
