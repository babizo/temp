<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>最難関突破 AI数学講師 v2.5.0</title>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            startup: { typeset: false }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.5; font-size: 14px; overflow-x: hidden; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .version-tag { font-size: 0.6rem; color: #888; font-family: monospace; background: #333; padding: 2px 6px; border-radius: 4px;}
        .debug-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        #debug-output { display: none; background: #300; color: #f99; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 0.7rem; margin-bottom: 10px; white-space: pre-wrap; word-break: break-all; border: 1px solid #600; }
        .canvas-container { background: #ffffff; border-radius: 6px; height: 260px; margin-bottom: 10px; overflow: hidden; position: relative; touch-action: none; display: flex; align-items: center; justify-content: center; border: 2px solid #333; text-align: center; }
        #svg-layer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: 0 0; color: #444; font-size: 0.8rem; flex-direction: column; }
        svg { width: 100%; height: 100%; display: block; }
        .loading-overlay { display: none; text-align: center; padding: 25px; background: rgba(0,0,0,0.95); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 8px; transition: 0.2s; }
        .btn-ai-gen { background: var(--ai); color: white; font-size: 0.9rem; }
        .btn-camera { background: var(--success); color: white; flex: 1; }
        .btn-answer-only { background: #555; color: white; font-size: 0.85rem; flex: 1; }
        .btn-cancel { background: #444; color: #ccc; font-size: 0.8rem; margin-top: 15px; width: auto; padding: 8px 20px; border: 1px solid #666; }
        .hint-box { display: none; color: var(--hint); font-weight: bold; padding: 12px; border-left: 4px solid var(--hint); font-size: 0.85rem; background: rgba(243, 156, 18, 0.08); margin: 10px 0; border-radius: 0 8px 8px 0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #444; font-size: 0.8rem; cursor: pointer; }
        .score-badge { background: #444; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        #p-text, #q-list li, #h-box, #res-box { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>

    <div class="debug-bar">
        <label><input type="checkbox" id="debug-mode"> DEBUG</label>
        <span class="version-tag">ver 2.5.0 Timer-Stability</span>
    </div>
    
    <div id="debug-output"></div>

    <div class="card">
        <div class="header-flex"><h1>分析パネル</h1></div>
        <div style="display:flex; justify-content:space-around; text-align:center;">
            <div>
                <div style="font-size:0.7rem; color:#aaa;">想定偏差値</div>
                <div style="display:flex; align-items:baseline; justify-content:center; gap:5px;"><span id="dev-val" style="font-size:1.5rem; font-weight:bold; color:var(--primary);">50.0</span><span id="target-school" style="font-size:0.7rem; color:var(--hint);">[都立中堅]</span></div>
            </div>
            <div><div style="font-size:0.7rem; color:#aaa;">累計演習</div><div id="count-val" style="font-size:1.5rem; font-weight:bold; color:var(--primary);">0</div></div>
        </div>
        <div id="unit-chart" style="margin-top:10px; font-size:0.8rem;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>演習 [<span id="u-title"></span>]</h1><button onclick="doSkip()" style="background:var(--skip); color:white; border:none; border-radius:4px; padding:4px 10px; font-size:0.7rem; width:auto;">他の単元へ ≫</button></div>
        <div class="canvas-container" id="zoom-box"><div id="svg-layer"></div></div>
        <div id="math-content-area">
            <p id="p-text" style="font-weight:bold; margin: 8px 0; color: #ccc; border-bottom: 1px dashed #444; padding-bottom: 8px;"></p>
            <ul id="q-list" style="padding-left: 20px; margin: 12px 0;"></ul>
            <div id="h-box" class="hint-box"></div>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:6px; font-size:0.8rem; flex:1;">💡 ヒント</button>
            <button class="btn-ai-gen" onclick="generateNext(false)" style="flex:2; margin:0;">✨ 類題作成</button>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; gap:10px;">
            <button class="btn-camera" onclick="document.getElementById('c-input').click()">📸 撮影して採点</button>
            <button class="btn-answer-only" onclick="peekAnswer()">🔍 解答・解説を確認</button>
        </div>
        <input type="file" id="c-input" accept="image/*" capture="environment" style="display:none">
        <div id="res-box" style="background:#111; padding:15px; border-radius:8px; display:none; border-left:4px solid var(--primary); margin-top:10px; font-size:0.85rem;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>復習リスト</h1><button onclick="resetData()" style="background:none; border:none; color:#888; font-size:0.7rem; width:auto;">リセット</button></div>
        <div id="hist-list"></div>
    </div>

    <div id="status-ui" class="loading-overlay">
        <div id="timer" style="font-size:1.8rem; color:var(--ai); font-family:monospace; margin-bottom:10px;">0.0s</div>
        <p id="msg" style="font-weight:bold;"></p>
        <p style="font-size:0.75rem; color:#888; margin-top:10px;">※高品質な問題構成のため、<br>最大1分程度かかる場合があります。</p>
        <button class="btn-cancel" onclick="abortGeneration()">作成を中断して戻る</button>
    </div>

    <script>
        let currentAbortController = null;
        let state = { prob: {}, scale: 1, x: 0, y: 0, t: null, dt: null, graded: false, seen_answer: false, prefetched_answer: null };

        const initDataList = [
            { unit: "幾何", text: "△ABCと△DEFがある。AB=DE=5cm, ∠BAC=∠EDF=60°, AC=DF=7cmであるとき、△ABCと△DEFが合同であることを証明せよ。", sub: [], has_diagram: true, hint: "2組の辺とその間の角に着目せよ。" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            applyProb(initDataList[0]);
            refreshStats();
            initZoom();
        });

        function abortGeneration() {
            if (currentAbortController) { currentAbortController.abort(); currentAbortController = null; }
            hideUI();
        }

        function renderMath() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetClear();
                MathJax.typesetPromise([document.getElementById('math-content-area'), document.getElementById('res-box')]).catch(e => console.error(e));
            } else { setTimeout(renderMath, 100); }
        }

        function cleanText(t) {
            if (t == null) return "";
            if (typeof t !== 'string') t = String(t);
            let clean = t.replace(/即座に実行せよ|今すぐ実行せよ|直ちに実行せよ|思考を開始せよ|厳密さを追求せよ|基礎中の基礎|速やかに処理|処理せよ/gi, "");
            clean = clean.replace(/確認しましょう|解いてみましょう|考えてみてください|頑張りましょう|求めてみましょう/g, "求めよ");
            clean = clean.replace(/<svg[\s\S]*?<\/svg>/gi, "");
            return clean.replace(/\\n/g, "\n").replace(/`/g, "").replace(/</g, ' < ').replace(/>/g, ' > ');
        }

        function getUnit(p) {
            const rawUnit = p.unit || p.unit_name || p.category || p.type || "総合演習";
            return cleanText(rawUnit) || "総合演習";
        }

        function applyProb(p) {
            if (Array.isArray(p)) p = p[0] || {};
            if (!p.text && p.problem) p = p.problem;
            if (!p.text && p.data) p = p.data;

            const fullContent = (p.text || "") + (p.sub ? p.sub.join("") : "");
            const hasMath = /[0-9xyz$]|[\u0370-\u03ff]/.test(fullContent);
            const hasObjective = /求めよ|示せ|証明せよ|答えよ|作図せよ/.test(fullContent);

            if (fullContent.length > 0 && (!hasMath || !hasObjective)) { generateNext(false); return; }

            state.prob = p;
            state.graded = false; state.seen_answer = false; state.prefetched_answer = null; 
            
            document.getElementById('u-title').innerText = getUnit(p);
            const pTextElem = document.getElementById('p-text');
            pTextElem.innerText = cleanText(p.text).trim() ? "【問題】\n" + cleanText(p.text).trim() : "";
            
            const rawSub = p.sub || p.questions || p.q || [];
            document.getElementById('q-list').innerHTML = (Array.isArray(rawSub) ? rawSub : [rawSub]).map(cleanText).filter(s => s.trim() !== "").map(s => `<li>${s}</li>`).join('');
            
            let hText = cleanText(p.hint).trim();
            document.getElementById('h-box').innerText = (!hText || hText === "なし") ? "基本原理に立ち返り、論理を構築せよ。" : hText;
            document.getElementById('h-box').style.display = 'none';
            document.getElementById('res-box').style.display = 'none';
            
            const layer = document.getElementById('svg-layer');
            if (p.has_diagram === false) { 
                document.getElementById('zoom-box').style.display = 'none'; 
            } else {
                document.getElementById('zoom-box').style.display = 'flex';
                // 作図開始前にプレースホルダーを表示
                layer.innerHTML = `<div style="color:var(--ai); font-weight:bold;">🎨 作図中...</div><div id="draw-timer-val" style="font-family:monospace; font-size:1.2rem; color:#aaa;">0.0s</div>`;
            }
            renderMath();
            prefetchAnswer();
        }

        async function prefetchAnswer() {
            if (!state.prob.text) return;
            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `解答と解説を出力せよ。数式LaTeX。問題：${state.prob.text}` }] }] })
                });
                const data = await res.json();
                state.prefetched_answer = cleanText(data.candidates[0].content.parts[0].text);
            } catch (e) {}
        }

        async function peekAnswer() {
            if (state.seen_answer) { alert("表示済みだ。"); return; }
            if (!confirm("解答を見ると、得点は0点となる。よろしいか？")) return;
            state.seen_answer = true;
            const resBox = document.getElementById('res-box');
            if (state.prefetched_answer) {
                resBox.innerHTML = state.prefetched_answer; resBox.style.display = 'block'; renderMath(); saveLog("×", 0); state.graded = true;
            } else {
                showUI("取得中...");
                try {
                    await prefetchAnswer();
                    resBox.innerHTML = state.prefetched_answer || "取得失敗。"; resBox.style.display = 'block'; renderMath(); saveLog("×", 0); state.graded = true;
                } catch (e) { alert("失敗"); } finally { hideUI(); }
            }
        }

        function robustJSONParse(rawStr) {
            let s = rawStr;
            const startIdx = s.indexOf('{'); const endIdx = s.lastIndexOf('}');
            if (startIdx !== -1 && endIdx !== -1) { s = s.substring(startIdx, endIdx + 1); }
            s = s.replace(/[\r\n]+/g, " "); 
            try { return JSON.parse(s); } catch (e) {
                s = s.replace(/\\\\/g, "___BS___").replace(/\\"/g, "___QT___").replace(/\\n/g, "___NW___").replace(/\\/g, "\\\\");
                s = s.replace(/___BS___/g, "\\\\").replace(/___QT___/g, "\\\"").replace(/___NW___/g, "\\n");
                return JSON.parse(s);
            }
        }

        async function generateNext(isOtherUnit = false) {
            const dev = parseFloat(document.getElementById('dev-val').innerText) || 50;
            const isProof = Math.random() < 0.2;
            showUI(`問題を構成中...`);
            currentAbortController = new AbortController();
            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    signal: currentAbortController.signal,
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: `数学問題エンジン。具体的数値を含むこと。「〜を求めよ」「〜を示せ」と末尾に明記せよ。JSON直下にtext, sub, unit, hint, has_diagramを含めよ。偏差値${dev}向け。${isProof ? "【指示】証明問題を出題せよ。" : ""} 幾何、関数、整数、確率からランダム。立体図形はSVG。JSONのみ。` }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const data = await res.json();
                const json = robustJSONParse(data.candidates[0].content.parts[0].text);
                applyProb(json);
                if (json.has_diagram !== false) autoDraw(0);
            } catch (e) { if (e.name !== 'AbortError') alert("生成失敗。やり直してください。"); }
            finally { currentAbortController = null; hideUI(); }
        }

        async function autoDraw(retryCount = 0) {
            if (!state.prob.text) return;
            const layer = document.getElementById('svg-layer');
            const timerVal = document.getElementById('draw-timer-val');
            let startTime = Date.now();
            
            clearInterval(state.dt);
            state.dt = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                if (timerVal) timerVal.innerText = elapsed + "s";
                else layer.innerHTML = `<div style="color:var(--ai); font-weight:bold;">🎨 作図中...</div><div id="draw-timer-val" style="font-family:monospace; font-size:1.2rem; color:#aaa;">${elapsed}s</div>`;
            }, 100);

            try {
                const res = await fetch(`/api/chat`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `問題「${state.prob.text}」を可視化した<svg>のみ。全ラベル配置。viewBox="0 0 200 200"。"&"等の実体参照禁止。` }] }] })
                });
                const data = await res.json();
                const match = data.candidates[0].content.parts[0].text.match(/<svg[\s\S]*?<\/svg>/i);
                if (match) { state.prob.svg = match[0]; layer.innerHTML = match[0]; }
                else if (retryCount < 1) { clearInterval(state.dt); autoDraw(retryCount + 1); }
                else layer.innerHTML = `<div style="color:#888; font-size:0.7rem;">図解なし</div>`;
            } catch (e) { if (retryCount < 1) { clearInterval(state.dt); autoDraw(retryCount + 1); } }
            finally { clearInterval(state.dt); }
        }

        async function doGrade(file) {
            if (state.seen_answer) { alert("解答閲覧済。"); return; }
            showUI("採点中...");
            try {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const res = await fetch(`/api/chat`, {
                        method: "POST", headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ contents: [{ parts: [{ text: `採点官。Score: X/10を末尾に。問題：${state.prob.text}` }, { inlineData: { mimeType: file.type || "image/jpeg", data: e.target.result.split(',')[1] } }] }] })
                    });
                    const data = await res.json();
                    const fb = cleanText(data.candidates[0].content.parts[0].text);
                    document.getElementById('res-box').innerText = fb; document.getElementById('res-box').style.display = 'block'; renderMath();
                    const score = parseInt((fb.match(/Score:\s*(\d+)/i)||[0,0])[1]);
                    saveLog(score >= 8 ? "○" : (score >= 4 ? "△" : "×"), score);
                    state.graded = true; hideUI();
                };
                reader.readAsDataURL(file);
            } catch (e) { hideUI(); alert("失敗"); }
        }

        function saveLog(mark, score) {
            let h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            h.unshift({ d: new Date().toLocaleDateString(), u: getUnit(state.prob), m: mark, s: score, p: JSON.parse(JSON.stringify(state.prob)) });
            localStorage.setItem('m_hist', JSON.stringify(h.slice(0, 30)));
            refreshStats();
        }

        function refreshStats() {
            const h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            document.getElementById('count-val').innerText = h.length;
            document.getElementById('hist-list').innerHTML = h.slice(0,10).map((x, i) => `<div class="history-item" onclick="loadHist(${i})"><span>${x.d} ${x.u || "総合"}</span><div><span class="score-badge">${x.s}/10</span> ${x.m}</div></div>`).join('');
            let dev = 50.0;
            if (h.length >= 1) dev = 40 + ((h.map(x => x.s).reduce((a,b)=>a+b,0)/h.length) * 3.5);
            document.getElementById('dev-val').innerText = dev.toFixed(1);
            let s = "[都立中堅]";
            if (dev >= 68) s = "[筑駒]"; else if (dev >= 66) s = "[開成]"; else if (dev >= 62) s = "[日比谷]"; else if (dev >= 52) s = "[上位校]";
            document.getElementById('target-school').innerText = s;
            const units = {};
            h.forEach(x => { const u = x.u || "その他"; if(!units[u]) units[u]={s:0,c:0}; units[u].s+=x.s; units[u].c++; });
            let html = "";
            for(let u in units) {
                const a = units[u].s/units[u].c;
                html += `<div style="margin-bottom:5px;"><span>${u}</span> <span style="float:right;">${a.toFixed(1)}/10</span><div style="background:#444; height:4px;"><div style="background:var(--success); height:100%; width:${a*10}%;"></div></div></div>`;
            }
            document.getElementById('unit-chart').innerHTML = html;
        }

        function initZoom() {
            const c = document.getElementById('zoom-box');
            let isDrag = false, sx = 0, sy = 0;
            c.onwheel = (e) => { e.preventDefault(); state.scale = Math.min(Math.max(0.5, state.scale * (e.deltaY > 0 ? 0.9 : 1.1)), 5); updateView(); };
            c.onmousedown = (e) => { isDrag = true; sx = e.clientX - state.x; sy = e.clientY - state.y; };
            window.onmousemove = (e) => { if(isDrag) { state.x = e.clientX - sx; state.y = e.clientY - sy; updateView(); } };
            window.onmouseup = () => isDrag = false;
            c.ontouchstart = (e) => { if(e.touches.length === 1) { isDrag = true; sx = e.touches[0].clientX - state.x; sy = e.touches[0].clientY - state.y; } };
            c.ontouchmove = (e) => { if(e.touches.length === 1 && isDrag) { state.x = e.touches[0].clientX - sx; state.y = e.touches[0].clientY - sy; } };
            c.ontouchend = () => isDrag = false;
        }
        function loadHist(i) { applyProb(JSON.parse(localStorage.getItem('m_hist'))[i].p); }
        function doSkip() { if (!state.graded) saveLog("SKIP", 0); generateNext(true); }
        function toggleHint() { const b = document.getElementById('h-box'); b.style.display = (b.style.display === 'block') ? 'none' : 'block'; renderMath(); }
        function resetData() { if(confirm("消去？")) { localStorage.clear(); location.reload(); } }
        function showUI(m) { document.getElementById('status-ui').style.display='block'; document.getElementById('msg').innerText=m; let s=Date.now(); clearInterval(state.t); state.t=setInterval(()=>{document.getElementById('timer').innerText=((Date.now()-s)/1000).toFixed(1)+"s";},100); }
        function hideUI() { document.getElementById('status-ui').style.display='none'; clearInterval(state.t); state.t = null; }
        function updateView() { document.getElementById('svg-layer').style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`; }
        document.getElementById('c-input').onchange = (e) => doGrade(e.target.files[0]);
    </script>
</body>
</html>
