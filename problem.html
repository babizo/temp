<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最難関突破 AI数学添削</title>
    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --error: #e74c3c; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; max-width: 800px; margin: auto; line-height: 1.6; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: var(--primary); font-size: 1.4rem; border-bottom: 2px solid var(--primary); padding-bottom: 8px; margin-top: 0; }
        
        /* 図解エリア：白背景固定 */
        .canvas-container { background: #ffffff; padding: 20px; border-radius: 8px; display: flex; justify-content: center; margin: 15px 0; }
        .math { color: var(--primary); font-weight: bold; font-family: 'Times New Roman', serif; }

        input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        
        #preview { width: 100%; border-radius: 8px; margin-top: 15px; display: none; border: 2px solid #555; }
        #result { background: #111; padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary); white-space: pre-wrap; display: none; margin-top: 20px; font-size: 0.95rem; }
        
        .loading { display: none; text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
        
        /* 復習リスト */
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #444; }
        .mark-○ { color: var(--success); font-weight: bold; font-size: 1.2rem; }
        .mark-△ { color: #f1c40f; font-weight: bold; font-size: 1.2rem; }
        .mark-× { color: var(--error); font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="card">
        <h1>初期設定</h1>
        <label for="apiKey">Gemini API Key (Gemini 2.5 Flash対応):</label>
        <input type="password" id="apiKey" placeholder="AI Studioで取得したキーを入力">
    </div>

    <div class="card">
        <h1>今日の一問 [<span id="unit-name"></span>]</h1>
        <p id="problem-text">読み込み中...</p>
        <div class="canvas-container" id="svg-container"></div>
        <ol id="sub-questions"></ol>
    </div>

    <div class="card">
        <h1>答案提出</h1>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
        <button onclick="document.getElementById('cameraInput').click()">カメラを起動して答案を撮影</button>
        <img id="preview">
        <button id="sendBtn" style="display:none; margin-top:15px; background:var(--success);">AI講師に添削を依頼する</button>
        <div class="loading" id="loading">Gemini 2.5 Flash が思考・解析中...</div>
    </div>

    <div id="result" class="card"></div>

    <div class="card">
        <h1>復習リスト（弱点克服）</h1>
        <div id="history-list">履歴はまだありません。</div>
        <button onclick="clearHistory()" style="margin-top:15px; background:#444; font-size:0.8rem; padding:8px; width:auto;">履歴リセット</button>
    </div>

    <script>
        // --- 1. 設定 & モデル名 ---
        const MODEL_NAME = "gemini-2.5-flash"; 

        // --- 2. 問題データベース（日替わり & 証明対応） ---
        const problemDatabase = [
            {
                unit: "関数と図形", // 日曜日相当
                get: (d) => {
                    const h = 10 + (d % 5);
                    return {
                        text: `座標平面上に 3点 A(0, ${h}), B(-6, 0), C(6, 0) を頂点とする二等辺三角形ABCがある。辺AC上の点P(t, y)からx軸へ垂線PQを下ろす。また辺AB上に点Rを、RQがx軸と平行になるようにとる。`,
                        sub: [`PQの長さを t で表せ。`, `四角形RPQCの面積が最大となる t の値を求めよ。`],
                        svg: `<svg width="280" height="200" viewBox="-100 -20 200 160"><g transform="scale(1, -1) translate(0, -130)"><line x1="-90" y1="0" x2="90" y2="0" stroke="#000" stroke-width="1.5"/><line x1="0" y1="-10" x2="0" y2="140" stroke="#000" stroke-width="1.5"/><path d="M-60 0 L0 120 L60 0 Z" fill="none" stroke="#2980b9" stroke-width="2"/><line x1="30" y1="60" x2="30" y2="0" stroke="#c0392b" stroke-width="2"/><line x1="-30" y1="60" x2="30" y2="60" stroke="#c0392b" stroke-dasharray="4"/></g><text x="85" y="145" font-size="10">x</text><text x="5" y="10" font-size="10">y</text><text x="-5" y="12" font-size="10" font-weight="bold">A</text><text x="35" y="65" font-size="10" fill="#c0392b">P</text></svg>`
                    };
                }
            },
            {
                unit: "図形の証明", // 月曜日相当
                get: (d) => ({
                    text: `右の図において、線分ABは円Oの直径であり、点Cは円周上の点である。点Cにおける円の接線と、ABの延長線の交点をPとする。`,
                    sub: [`∠PCB = ∠PAC であることを証明せよ。`],
                    svg: `<svg width="280" height="150" viewBox="0 0 200 120"><circle cx="100" cy="70" r="40" fill="none" stroke="#000" stroke-width="2"/><line x1="20" y1="70" x2="180" y2="70" stroke="#000"/><line x1="130" y1="45" x2="180" y2="70" stroke="#c0392b" stroke-width="2"/><text x="135" y="40" font-size="10">C</text><text x="185" y="75" font-size="10">P</text></svg>`
                })
            }
        ];

        // --- 3. 初期化 ---
        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;

            const today = new Date();
            const dayIndex = today.getDay() % problemDatabase.length;
            const prob = problemDatabase[dayIndex].get(today.getDate());
            
            document.getElementById('unit-name').innerText = prob.unit;
            document.getElementById('problem-text').innerText = prob.text;
            document.getElementById('svg-container').innerHTML = prob.svg;
            document.getElementById('sub-questions').innerHTML = prob.sub.map(s => `<li>${s}</li>`).join('');
            
            showHistory();
        };

        const cameraInput = document.getElementById('cameraInput');
        const preview = document.getElementById('preview');
        const sendBtn = document.getElementById('sendBtn');
        let base64Image = "";

        cameraInput.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                base64Image = reader.result.split(',')[1];
                preview.src = reader.result; preview.style.display = 'block'; sendBtn.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        // --- 4. 添削実行 (Gemini 2.5 Flash) ---
        sendBtn.onclick = async () => {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("API Keyを入力してください");
            localStorage.setItem('gemini_api_key', key);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`;

            const payload = {
                contents: [{
                    parts: [
                        { text: `あなたは最難関高校受験（筑駒・開成）の数学講師です。
                        【問題】: ${document.getElementById('problem-text').innerText}
                        【提出答案】: 画像の手書き答案を解析し、論理の正当性と記述の質を厳密に添削してください。
                        必ず【判定】(○/△/×)から始めて、思考プロセスを高く評価しつつ改善点をアドバイスしてください。` },
                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                    ]
                }],
                generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
            };

            try {
                const res = await fetch(API_URL, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                const feedback = data.candidates[0].content.parts[0].text;
                document.getElementById('result').innerText = feedback;
                document.getElementById('result').style.display = 'block';

                const mark = feedback.includes("○") ? "○" : feedback.includes("△") ? "△" : "×";
                saveHistory(mark);
            } catch (e) {
                alert("添削エラー: " + e.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        };

        function saveHistory(mark) {
            let history = JSON.parse(localStorage.getItem('math_history') || "[]");
            history.unshift({ date: new Date().toLocaleDateString(), unit: document.getElementById('unit-name').innerText, mark: mark });
            localStorage.setItem('math_history', JSON.stringify(history.slice(0, 15)));
            showHistory();
        }

        function showHistory() {
            const history = JSON.parse(localStorage.getItem('math_history') || "[]");
            const list = document.getElementById('history-list');
            if (history.length === 0) return;
            list.innerHTML = history.map(h => `<div class="history-item"><span>${h.date} - ${h.unit}</span><span class="mark-${h.mark}">${h.mark}</span></div>`).join('');
        }

        function clearHistory() { if(confirm("履歴を削除しますか？")) { localStorage.removeItem('math_history'); location.reload(); } }
    </script>
</body>
</html>
