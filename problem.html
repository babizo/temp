<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最難関突破 AI数学添削 & ヒント機能</title>
    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; max-width: 800px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; }
        h1 { color: var(--primary); font-size: 1.3rem; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        .canvas-container { background: #ffffff; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; margin: 15px 0; }
        .hint-text { display: none; color: var(--hint); font-weight: bold; margin-top: 10px; font-size: 0.9rem; border: 1px dashed var(--hint); padding: 5px 10px; border-radius: 5px; }
        button { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 1rem; cursor: pointer; font-weight: bold; }
        .btn-hint { background: var(--hint); margin-bottom: 10px; }
        #preview { width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
        #result { background: #111; padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary); white-space: pre-wrap; display: none; margin-top: 20px; }
        .loading { display: none; text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>初期設定</h1>
        <input type="password" id="apiKey" placeholder="Gemini API Keyを入力">
    </div>

    <div class="card">
        <h1>今日の一問 [<span id="unit-name"></span>]</h1>
        <p id="problem-text"></p>
        <div class="canvas-container">
            <div id="svg-container"></div>
            <button class="btn-hint" onclick="toggleHint()">ヒントを表示/非表示</button>
            <div id="hint-area" class="hint-text"></div>
        </div>
        <ol id="sub-questions"></ol>
    </div>

    <div class="card">
        <h1>答案提出</h1>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
        <button onclick="document.getElementById('cameraInput').click()">カメラを起動して撮影</button>
        <img id="preview">
        <button id="sendBtn" style="display:none; margin-top:15px; background:var(--success);">AI講師に添削を依頼する</button>
        <div class="loading" id="loading">Gemini 2.5 Flash 解析中...</div>
    </div>

    <div id="result" class="card"></div>

    <script>
        const MODEL_NAME = "gemini-2.5-flash";

        const problemDatabase = [
            {
                unit: "関数と図形",
                get: (d) => {
                    const h = 10 + (d % 5);
                    return {
                        text: `座標平面上に 3点 A(0, ${h}), B(-6, 0), C(6, 0) を頂点とする二等辺三角形ABCがある。辺AC上の点P(t, y)からx軸へ垂線PQを下ろす。また辺AB上に点RをRQ//BCとなるようにとる。`,
                        sub: [`PQの長さを t で表せ。`, `四角形RPQCの面積が最大となる t を求めよ。`],
                        hint: "点Pの座標を (t, y) としたとき、yが点Pの『高さ』、つまりPQの長さになります。線分ACの式を求めましょう。",
                        svg: `<svg width="300" height="220" viewBox="-110 -20 220 160">
                            <g transform="scale(1, -1) translate(0, -130)">
                                <line x1="-100" y1="0" x2="100" y2="0" stroke="#000" stroke-width="1.5"/><line x1="0" y1="-10" x2="0" y2="140" stroke="#000" stroke-width="1.5"/>
                                <path d="M-60 0 L0 120 L60 0 Z" fill="rgba(41,128,185,0.1)" stroke="#2980b9" stroke-width="2"/>
                                <line x1="30" y1="60" x2="30" y2="0" stroke="#c0392b" stroke-width="2.5"/>
                                <line x1="-30" y1="60" x2="30" y2="60" stroke="#c0392b" stroke-width="2" stroke-dasharray="4"/>
                                <circle cx="30" cy="60" r="4" fill="#c0392b"/><circle cx="30" cy="0" r="4" fill="#c0392b"/><circle cx="-30" cy="60" r="4" fill="#c0392b"/>
                            </g>
                            <text x="95" y="135" font-size="12" font-weight="bold">x</text><text x="5" y="10" font-size="12" font-weight="bold">y</text>
                            <text x="-20" y="10" font-size="12" font-weight="bold" fill="#2980b9">A(0,${h})</text>
                            <text x="-105" y="145" font-size="11">B(-6,0)</text><text x="65" y="145" font-size="11">C(6,0)</text>
                            <text x="35" y="60" font-size="12" fill="#c0392b" font-weight="bold">P(t, y)</text>
                            <text x="35" y="145" font-size="12" fill="#c0392b" font-weight="bold">Q</text>
                            <text x="-45" y="60" font-size="12" fill="#c0392b" font-weight="bold">R</text>
                            <g id="svg-hint" style="display:none;">
                                <text x="-80" y="80" font-size="11" fill="#f39c12">← RQ // BC (平行)</text>
                                <path d="M 30 115 L 30 125 M 25 120 L 35 120" stroke="#f39c12" stroke-width="1"/>
                                <text x="10" y="110" font-size="10" fill="#f39c12">PQ ⊥ x軸</text>
                            </g>
                        </svg>`
                    };
                }
            }
        ];

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;

            const today = new Date();
            const p = problemDatabase[0].get(today.getDate());
            document.getElementById('unit-name').innerText = p.unit;
            document.getElementById('problem-text').innerText = p.text;
            document.getElementById('svg-container').innerHTML = p.svg;
            document.getElementById('hint-area').innerText = "ヒント: " + p.hint;
            document.getElementById('sub-questions').innerHTML = p.sub.map(s => `<li>${s}</li>`).join('');
        };

        function toggleHint() {
            const area = document.getElementById('hint-area');
            const svgHint = document.getElementById('svg-hint');
            const isVisible = area.style.display === 'block';
            area.style.display = isVisible ? 'none' : 'block';
            if(svgHint) svgHint.style.display = isVisible ? 'none' : 'block';
        }

        const cameraInput = document.getElementById('cameraInput');
        const preview = document.getElementById('preview');
        const sendBtn = document.getElementById('sendBtn');
        let base64Image = "";

        cameraInput.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                base64Image = reader.result.split(',')[1];
                preview.src = reader.result; preview.style.display = 'block'; sendBtn.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        sendBtn.onclick = async () => {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("Keyを入力してください");
            localStorage.setItem('gemini_api_key', key);
            document.getElementById('loading').style.display = 'block';

            const payload = {
                contents: [{
                    parts: [
                        { text: `筑駒・開成講師として添削せよ。問題：${document.getElementById('problem-text').innerText}\n生徒へのヒント：${document.getElementById('hint-area').innerText}\n画像の手書き答案を解析し、【判定】(○/△/×)から始めて論理的に添削せよ。` },
                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                    ]
                }],
                generationConfig: { temperature: 0.4, maxOutputTokens: 4096, thinking_budget: 2048 }
            };

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
                const data = await res.json();
                document.getElementById('result').innerText = data.candidates[0].content.parts[0].text;
                document.getElementById('result').style.display = 'block';
            } catch (e) { alert("エラー: " + e.message); }
            finally { document.getElementById('loading').style.display = 'none'; }
        };
    </script>
</body>
</html>
