<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最難関突破 AI数学添削</title>
    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --error: #e74c3c; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; max-width: 800px; margin: auto; line-height: 1.6; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: var(--primary); font-size: 1.4rem; border-bottom: 2px solid var(--primary); padding-bottom: 8px; margin-top: 0; }
        .canvas-container { background: #ffffff; padding: 20px; border-radius: 8px; display: flex; justify-content: center; margin: 15px 0; }
        input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        #preview { width: 100%; border-radius: 8px; margin-top: 15px; display: none; border: 2px solid #555; }
        #result { background: #111; padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary); white-space: pre-wrap; display: none; margin-top: 20px; font-size: 0.95rem; }
        .loading { display: none; text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

    <div class="card">
        <h1>初期設定</h1>
        <input type="password" id="apiKey" placeholder="Gemini API Keyを入力">
    </div>

    <div class="card">
        <h1>今日の一問 [<span id="unit-name"></span>]</h1>
        <p id="problem-text">読み込み中...</p>
        <div class="canvas-container" id="svg-container"></div>
        <ol id="sub-questions"></ol>
    </div>

    <div class="card">
        <h1>答案提出</h1>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
        <button onclick="document.getElementById('cameraInput').click()">カメラを起動して撮影</button>
        <img id="preview">
        <button id="sendBtn" style="display:none; margin-top:15px; background:var(--success);">AI講師に添削を依頼する</button>
        <div class="loading" id="loading">Gemini 2.5 Flash が思考・解析中...</div>
    </div>

    <div id="result" class="card"></div>

    <div class="card">
        <h1>復習リスト</h1>
        <div id="history-list">履歴はまだありません。</div>
        <button onclick="clearHistory()" style="margin-top:15px; background:#444; font-size:0.8rem; padding:8px; width:auto;">履歴リセット</button>
    </div>

    <script>
        const MODEL_NAME = "gemini-2.5-flash"; 

        // --- 全曜日対応データベース ---
        const problemDatabase = [
            { unit: "関数と図形", title: "二等辺三角形と動点", svg: `<svg width="200" height="150" viewBox="-80 -10 160 130"><path d="M-50 0 L0 100 L50 0 Z" stroke="#2980b9" fill="none" stroke-width="2"/><line x1="25" y1="50" x2="25" y2="0" stroke="red"/><line x1="-25" y1="50" x2="25" y2="50" stroke="red" stroke-dasharray="3"/></svg>`, get: (d) => ({ text: `A(0, ${10+(d%5)}), B(-6,0), C(6,0)の二等辺三角形ABCがある。辺AC上の点Pからx軸に下ろした垂線をPQ、辺AB上の点RをRQ//BCとなるようにとる。`, sub: ["PQの長さをtで表せ", "四角形RPQCの面積が最大となるtを求めよ"] }) },
            { unit: "図形の証明", title: "円周角と相似", svg: `<svg width="200" height="120" viewBox="0 0 200 120"><circle cx="100" cy="70" r="40" fill="none" stroke="#000" stroke-width="2"/><line x1="20" y1="70" x2="180" y2="70" stroke="#000"/><line x1="130" y1="45" x2="180" y2="70" stroke="red" stroke-width="2"/></svg>`, get: (d) => ({ text: `線分ABは円Oの直径、点Cは円周上の点。点Cにおける接線とABの延長線の交点をPとする。`, sub: ["∠PCB = ∠PAC であることを証明せよ。"] }) }
        ];

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;

            const today = new Date();
            // データベースの範囲を超えないように調整（undefined回避）
            const dataIndex = today.getDay() % problemDatabase.length;
            const probTemplate = problemDatabase[dataIndex];
            const prob = probTemplate.get(today.getDate());
            
            document.getElementById('unit-name').innerText = probTemplate.unit;
            document.getElementById('problem-text').innerText = prob.text;
            document.getElementById('svg-container').innerHTML = probTemplate.svg;
            document.getElementById('sub-questions').innerHTML = prob.sub.map(s => `<li>${s}</li>`).join('');
            showHistory();
        };

        const cameraInput = document.getElementById('cameraInput');
        const preview = document.getElementById('preview');
        const sendBtn = document.getElementById('sendBtn');
        let base64Image = "";

        cameraInput.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                base64Image = reader.result.split(',')[1];
                preview.src = reader.result; preview.style.display = 'block'; sendBtn.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };

        sendBtn.onclick = async () => {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("API Keyを入力してください");
            localStorage.setItem('gemini_api_key', key);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            const payload = {
                contents: [{
                    parts: [
                        { text: `筑駒・開成講師として添削せよ。問題：${document.getElementById('problem-text').innerText}。記述の論理性を厳密に採点し、【判定】(○/△/×)から始めて最後まで具体的に解説せよ。` },
                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                    ]
                }],
                generationConfig: { 
                    temperature: 0.4, 
                    maxOutputTokens: 4096, // 回答が切れないよう増量
                    thinking_budget: 2048   // 思考用予算を確保
                }
            };

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
                const data = await res.json();
                const feedback = data.candidates[0].content.parts[0].text;
                document.getElementById('result').innerText = feedback;
                document.getElementById('result').style.display = 'block';
                saveHistory(feedback.includes("○") ? "○" : feedback.includes("△") ? "△" : "×");
            } catch (e) { alert("添削エラー: " + e.message); }
            finally { document.getElementById('loading').style.display = 'none'; }
        };

        function saveHistory(mark) {
            let history = JSON.parse(localStorage.getItem('math_history') || "[]");
            history.unshift({ date: new Date().toLocaleDateString(), unit: document.getElementById('unit-name').innerText, mark: mark });
            localStorage.setItem('math_history', JSON.stringify(history.slice(0, 15)));
            showHistory();
        }

        function showHistory() {
            const history = JSON.parse(localStorage.getItem('math_history') || "[]");
            if (history.length > 0) document.getElementById('history-list').innerHTML = history.map(h => `<div class="history-item"><span>${h.date} - ${h.unit}</span><span>${h.mark}</span></div>`).join('');
        }

        function clearHistory() { if(confirm("履歴リセット？")) { localStorage.removeItem('math_history'); location.reload(); } }
    </script>
</body>
</html>
