<script>
    // --- Gemini 2.5 Flash (Latest) 設定 ---
    const MODEL_NAME = "gemini-2.5-flash"; 
    
    // 中略（問題DBや初期化処理はそのまま）

    sendBtn.onclick = async () => {
        const key = document.getElementById('apiKey').value;
        if(!key) return alert("APIキーを入力してください");
        localStorage.setItem('gemini_api_key', key);

        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`;

        document.getElementById('loading').style.display = 'block';
        document.getElementById('result').style.display = 'none';

        const payload = {
            contents: [{
                parts: [
                    { text: `あなたは最難関中学・高校受験指導のプロフェッショナルです。
                    【問題】：${document.getElementById('problem-text').innerText}
                    【指示】：生徒の手書き答案を解析し、論理の飛躍がないか厳密に添削してください。
                    【出力形式】：
                    1. 【判定】(○/△/×)
                    2. 【得点】(10点満点)
                    3. 【思考のプロセス評価】(答案から読み取れる生徒の思考を分析)
                    4. 【具体的な修正点】
                    5. 【合格へのアドバイス】` },
                    { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                ]
            }],
            generationConfig: {
                temperature: 0.7, // 2.5系は思考の柔軟性を出すため少し高めでも安定します
                topP: 0.95,
                maxOutputTokens: 2048
            }
        };

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            
            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            const feedback = data.candidates[0].content.parts[0].text;
            document.getElementById('result').innerText = feedback;
            document.getElementById('result').style.display = 'block';

            const mark = feedback.includes("○") ? "○" : feedback.includes("△") ? "△" : "×";
            saveHistory(mark);

        } catch (e) {
            console.error(e);
            alert("2.5 Flash連携エラー: " + e.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    };
</script>
