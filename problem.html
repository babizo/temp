<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>最難関突破 AI数学講師</title>
    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --skip: #95a5a6; --ai: #a29bfe; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.4; font-size: 14px; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .version-tag { font-size: 0.6rem; color: #888; font-family: monospace; }
        .btn-skip { background: var(--skip); color: white; border: none; border-radius: 4px; padding: 3px 8px; font-size: 0.7rem; cursor: pointer; }
        
        /* 図解エリア：スマホで大きく見えるよう調整 */
        .canvas-container { background: #ffffff; padding: 10px; border-radius: 6px; display: flex; justify-content: center; min-height: 200px; margin-bottom: 10px; overflow: hidden; }
        svg { width: 100%; height: auto; max-height: 220px; }

        .hint-box { display: none; color: var(--hint); font-weight: bold; padding: 10px; border-left: 3px solid var(--hint); font-size: 0.85rem; background: rgba(243, 156, 18, 0.05); margin: 10px 0; }
        
        /* ボタン類：スマホで押しやすい高さ(44px以上)を確保 */
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 8px; }
        .btn-camera { background: var(--success); color: white; height: 50px; }
        .btn-ai-gen { background: var(--ai); color: white; font-size: 0.9rem; }
        
        .loading { display: none; text-align: center; color: var(--ai); font-weight: bold; padding: 10px; font-size: 0.9rem; }
        .history-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #444; font-size: 0.75rem; }
        .mark-○ { color: var(--success); font-weight: bold; }
    </style>
</head>
<body>

    <div class="card" style="padding: 10px;">
        <div class="header-flex">
            <h1>演習 [<span id="unit-name"></span>]</h1>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="version-tag">v1.2.3</span>
                <button class="btn-skip" onclick="skipProblem()">SKIP</button>
            </div>
        </div>
        <div id="loading-ai" class="loading">類題生成中...</div>
        <div class="canvas-container" id="svg-container"></div>
        <p id="problem-text" style="font-weight:bold; margin: 5px 0;"></p>
        <ol id="sub-questions" style="padding-left: 20px; margin: 5px 0;"></ol>
        
        <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:4px; width:auto; font-size:0.75rem; margin-top:5px;">💡 ヒント</button>
        <div id="hint-area" class="hint-box"></div>
    </div>

    <div class="card">
        <button class="btn-camera" onclick="document.getElementById('cameraInput').click()">📸 撮影して提出・添削</button>
        <button class="btn-ai-gen" onclick="generateSimilarProblem()">✨ AI類題を作成</button>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
        <div id="loading-grade" class="loading">AI添削中...</div>
        <div id="result" style="background:#111; padding:12px; border-radius:6px; font-size:0.85rem; display:none; border-left:4px solid var(--primary); margin-top:10px; white-space:pre-wrap;"></div>
    </div>

    <div class="card" style="padding: 10px;">
        <h2 style="font-size:0.9rem; margin:0 0 8px 0;">復習リスト</h2>
        <div id="history-list"></div>
        <input type="password" id="apiKey" style="width:100%; margin-top:10px; padding:8px; background:#333; color:#eee; border:1px solid #555; border-radius:4px; font-size:0.7rem;" placeholder="Gemini API Key">
    </div>

    <script>
        const MODEL_NAME = "gemini-2.5-flash";
        let currentProb = {};
        let currentIdx = new Date().getDate();

        // さきほどの10問データ（一部抜粋して初期表示）
        const problemDatabase = [
            {
                unit: "灘高・空間図形",
                text: "一辺6の立方体。辺AB, BC, CGの中点P, Q, Rを通る平面で切断する。",
                sub: ["切り口の形状は？", "点Bを含む方の体積は？"],
                svg: `<svg viewBox="0 0 200 180"><path d="M50 50 L130 50 L130 130 L50 130 Z" fill="none" stroke="#333"/><path d="M80 20 L160 20 L160 100 L80 100 Z" fill="none" stroke="#333"/><path d="M50 50 L80 20 M130 50 L160 20 M130 130 L160 100 M50 130 L80 100" fill="none" stroke="#333"/><path d="M90 50 L130 90 L145 60 Z" fill="rgba(231,76,60,0.3)" stroke="#e74c3c" stroke-width="2"/><text x="140" y="45" font-size="12" fill="#e74c3c">P,Q,R</text></svg>`,
                hint: "切り口は正三角形。三角錐の体積として計算。"
            }
        ];

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            displayProblem(problemDatabase[0]);
            showHistory();
        };

        function displayProblem(prob) {
            currentProb = prob;
            document.getElementById('unit-name').innerText = prob.unit;
            document.getElementById('problem-text').innerText = prob.text;
            document.getElementById('svg-container').innerHTML = prob.svg;
            document.getElementById('sub-questions').innerHTML = prob.sub.map(s => `<li>${s}</li>`).join('');
            document.getElementById('hint-area').innerText = prob.hint;
            document.getElementById('hint-area').style.display = 'none';
            document.getElementById('result').style.display = 'none';
        }

        async function generateSimilarProblem() {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("Keyを入力してください");
            document.getElementById('loading-ai').style.display = 'block';
            const prompt = `数学講師として問題『${currentProb.text}』の数値違い類題を1問作成。Markdown無しのJSONのみ返して。{"unit":"...","text":"...","sub":["..."],"svg":"...","hint":"..."}`;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                const jsonMatch = data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/);
                displayProblem(JSON.parse(jsonMatch[0]));
            } catch (e) { alert("生成失敗"); }
            finally { document.getElementById('loading-ai').style.display = 'none'; }
        }

        function skipProblem() {
            saveHistory("SKIP");
            currentIdx++;
            displayProblem(problemDatabase[currentIdx % problemDatabase.length]);
        }

        function toggleHint() {
            const h = document.getElementById('hint-area');
            h.style.display = (h.style.display === 'block') ? 'none' : 'block';
        }

        document.getElementById('cameraInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onloadend = () => startGrading(reader.result.split(',')[1]);
            reader.readAsDataURL(e.target.files[0]);
        };

        async function startGrading(base64) {
            const key = document.getElementById('apiKey').value;
            document.getElementById('loading-grade').style.display = 'block';
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `添削：${currentProb.text}` }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }] })
                });
                const data = await res.json();
                const feedback = data.candidates[0].content.parts[0].text;
                document.getElementById('result').innerText = feedback;
                document.getElementById('result').style.display = 'block';
                saveHistory(feedback.includes("○") ? "○" : "×");
            } catch (e) { alert("エラー"); }
            finally { document.getElementById('loading-grade').style.display = 'none'; }
        }

        function saveHistory(mark) {
            let history = JSON.parse(localStorage.getItem('math_history') || "[]");
            history.unshift({ date: new Date().toLocaleDateString(), unit: document.getElementById('unit-name').innerText, mark: mark });
            localStorage.setItem('math_history', JSON.stringify(history.slice(0, 10)));
            showHistory();
        }

        function showHistory() {
            const history = JSON.parse(localStorage.getItem('math_history') || "[]");
            document.getElementById('history-list').innerHTML = history.map(h => `<div class="history-item"><span>${h.date} ${h.unit}</span><span>${h.mark}</span></div>`).join('');
        }
    </script>
</body>
</html>
