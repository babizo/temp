<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最難関高校突破 AI数学講師</title>
    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; max-width: 800px; margin: auto; line-height: 1.6; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 15px; padding-bottom: 8px; }
        h1 { color: var(--primary); font-size: 1.3rem; margin: 0; }
        .version-tag { font-size: 0.7rem; color: #888; font-family: monospace; }
        .canvas-container { background: #ffffff; padding: 25px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 280px; margin-bottom: 15px; }
        .hint-box { display: none; color: var(--hint); font-weight: bold; padding: 12px; border-left: 4px solid var(--hint); font-size: 0.9rem; background: rgba(243, 156, 18, 0.05); margin-bottom: 15px; border-radius: 0 5px 5px 0; }
        button { border: none; border-radius: 8px; padding: 15px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; transition: 0.3s; margin-bottom: 10px; }
        .btn-camera { background: var(--success); color: white; }
        .btn-ai-gen { background: var(--ai); color: white; }
        .btn-skip { background: var(--skip); color: white; width: auto; padding: 4px 12px; font-size: 0.75rem; }
        input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; background: #333; color: white; border: 1px solid #444; box-sizing: border-box; }
        #result { background: #111; padding: 20px; border-radius: 8px; border-left: 5px solid var(--primary); white-space: pre-wrap; display: none; margin-top: 20px; }
        .loading { display: none; text-align: center; color: var(--ai); font-weight: bold; padding: 20px; }
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #444; font-size: 0.8rem; }
        .mark-○ { color: var(--success); font-weight: bold; }
        .mark-SKIP { color: var(--skip); font-style: italic; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-flex">
            <h1>1. 設定</h1>
            <span class="version-tag">ver 1.2.1</span>
        </div>
        <input type="password" id="apiKey" placeholder="Gemini API Keyを入力">
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>2. 演習 [<span id="unit-name"></span>]</h1>
            <div class="header-right" style="display:flex; align-items:center; gap:10px;">
                <span class="version-tag">2.5-Flash</span>
                <button class="btn-skip" onclick="skipProblem()">SKIP ≫</button>
            </div>
        </div>
        <div id="loading-ai" class="loading">AIが類題を生成中... 数秒かかります</div>
        <div class="canvas-container" id="svg-container"></div>
        <div class="problem-info">
            <p id="problem-text" style="font-weight:bold;"></p>
            <ol id="sub-questions"></ol>
            <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:5px; width:auto; font-size:0.8rem;">💡 ヒント</button>
            <div id="hint-area" class="hint-box"></div>
            <button class="btn-ai-gen" onclick="generateSimilarProblem()">✨ AIでこの類題を生成（無限演習）</button>
        </div>
    </div>

    <div class="card">
        <h1>3. 提出・添削</h1>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
        <button class="btn-camera" onclick="document.getElementById('cameraInput').click()">撮影して提出</button>
        <div id="loading-grade" class="loading">AI講師が解析中...</div>
        <div id="result"></div>
    </div>

    <div class="card">
        <h1>4. 復習リスト (Best 50 Challenge)</h1>
        <div id="history-list"></div>
        <button onclick="clearHistory()" style="margin-top:15px; background:#444; font-size:0.8rem; padding:8px; width:auto; color:white;">履歴リセット</button>
    </div>

    <script>
        const MODEL_NAME = "gemini-2.5-flash";
        let currentProb = {};
        let currentProbIndex = new Date().getDate() % 10; // 初期値

        // 高校入試 数学 厳選データ (第1弾 10問)
        const problemDatabase = [
            {
                unit: "灘高・空間図形",
                text: "一辺の長さが6の正四面体ABCDがある。辺ABの中点をM、辺CDの中点をNとする。",
                sub: ["線分MNの長さを求めよ。", "3点A, M, Nを通る平面で正四面体を切断したときの切り口の面積を求めよ。"],
                svg: `<svg width="250" height="180" viewBox="0 0 200 180"><path d="M100 20 L40 150 L160 150 Z" fill="none" stroke="#333" stroke-width="2"/><path d="M100 20 L100 150" stroke="#333" stroke-dasharray="4"/><text x="95" y="15">A</text><text x="30" y="165">B</text><text x="165" y="165">C</text></svg>`,
                hint: "MNは2つの面の共通の垂線になります。"
            },
            {
                unit: "開成高・平面図形",
                text: "AB=5, BC=6, CA=7の三角形ABCの内接円の半径をrとする。",
                sub: ["三角形ABCの面積を求めよ。", "半径rの値を求めよ。"],
                svg: `<svg width="250" height="180" viewBox="0 0 200 150"><path d="M100 20 L40 130 L160 130 Z" fill="none" stroke="#333"/><circle cx="100" cy="95" r="35" fill="none" stroke="#e74c3c"/></svg>`,
                hint: "面積 = 1/2 × 内接円半径 × (三辺の和) を利用します。"
            }
            // ... (ここに残りの8問を追加可能)
        ];

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            displayProblem(problemDatabase[currentProbIndex % problemDatabase.length]);
            showHistory();
        };

        function displayProblem(prob) {
            currentProb = prob;
            document.getElementById('unit-name').innerText = prob.unit;
            document.getElementById('problem-text').innerText = prob.text;
            document.getElementById('svg-container').innerHTML = prob.svg;
            document.getElementById('sub-questions').innerHTML = prob.sub.map(s => `<li>${s}</li>`).join('');
            document.getElementById('hint-area').innerText = prob.hint;
            document.getElementById('hint-area').style.display = 'none';
            document.getElementById('result').style.display = 'none';
        }

        async function generateSimilarProblem() {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("APIキーを入力してください");
            document.getElementById('loading-ai').style.display = 'block';
            
            // JSONのみを返すよう厳密に指示
            const prompt = `あなたは最難関高校数学講師です。問題『${currentProb.text}』の数値違いの類題を1問作成してください。
            Markdownの枠(jsonタグ等)は一切使わず、純粋なJSON文字列のみを出力してください。
            {"unit": "類題: ${currentProb.unit}", "text": "...", "sub": ["...", "..."], "svg": "...", "hint": "..."}`;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                let rawJson = data.candidates[0].content.parts[0].text;
                // 万が一Markdownの枠が含まれていた場合の除去処理
                rawJson = rawJson.replace(/```json/g, "").replace(/```/g, "").trim();
                displayProblem(JSON.parse(rawJson));
            } catch (e) { alert("AI生成エラー。もう一度試してください。"); }
            finally { document.getElementById('loading-ai').style.display = 'none'; }
        }

        function skipProblem() {
            saveHistory("SKIP");
            currentProbIndex++;
            displayProblem(problemDatabase[currentProbIndex % problemDatabase.length]);
        }

        function toggleHint() {
            const h = document.getElementById('hint-area');
            h.style.display = (h.style.display === 'block') ? 'none' : 'block';
        }

        const cameraInput = document.getElementById('cameraInput');
        cameraInput.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                const base64Image = reader.result.split(',')[1];
                startGrading(base64Image);
            };
            reader.readAsDataURL(file);
        };

        async function startGrading(base64) {
            const key = document.getElementById('apiKey').value;
            document.getElementById('loading-grade').style.display = 'block';
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `最難関高校講師として添削。問題：${currentProb.text}。判定○△×から始め解説せよ。` }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }], generationConfig: { temperature: 0.4, maxOutputTokens: 4096, thinking_budget: 2048 } })
                });
                const data = await res.json();
                const feedback = data.candidates[0].content.parts[0].text;
                document.getElementById('result').innerText = feedback;
                document.getElementById('result').style.display = 'block';
                const mark = feedback.includes("○") ? "○" : feedback.includes("△") ? "△" : "×";
                saveHistory(mark);
            } catch (e) { alert("エラー: " + e.message); }
            finally { document.getElementById('loading-grade').style.display = 'none'; }
        }

        function saveHistory(mark) {
            let history = JSON.parse(localStorage.getItem('math_history') || "[]");
            history.unshift({ date: new Date().toLocaleDateString(), unit: document.getElementById('unit-name').innerText, mark: mark });
            localStorage.setItem('math_history', JSON.stringify(history.slice(0, 50)));
            showHistory();
        }

        function showHistory() {
            const history = JSON.parse(localStorage.getItem('math_history') || "[]");
            const list = document.getElementById('history-list');
            list.innerHTML = history.length ? history.map(h => `<div class="history-item"><span>${h.date} - ${h.unit}</span><span class="mark-${h.mark}">${h.mark}</span></div>`).join('') : "履歴なし";
        }

        function clearHistory() { if(confirm("消去？")) { localStorage.removeItem('math_history'); location.reload(); } }
    </script>
</body>
</html>
