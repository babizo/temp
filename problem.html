<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>最難関突破 AI数学講師 v1.6.0</title>
    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.4; font-size: 14px; overflow-x: hidden; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .version-tag { font-size: 0.6rem; color: #888; font-family: monospace; }
        
        .settings-toggle { background: #333; color: #888; font-size: 0.7rem; padding: 5px 10px; border-radius: 5px; cursor: pointer; text-align: center; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        #settings-area { display: none; padding: 10px; background: #222; border-radius: 8px; margin-bottom: 10px; }

        .canvas-container { background: #ffffff; border-radius: 6px; height: 260px; margin-bottom: 10px; overflow: hidden; position: relative; touch-action: none; display: flex; align-items: center; justify-content: center; border: 2px solid #333; }
        #svg-layer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transform-origin: 0 0; }
        svg { width: 100%; height: 100%; display: block; }

        .loading-overlay { display: none; text-align: center; padding: 15px; background: rgba(0,0,0,0.95); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 8px; transition: 0.2s; }
        .btn-ai-gen { background: var(--ai); color: white; font-size: 0.9rem; }
        .btn-camera { background: var(--success); color: white; height: 52px; }
        
        .hint-box { display: none; color: var(--hint); font-weight: bold; padding: 12px; border-left: 4px solid var(--hint); font-size: 0.85rem; background: rgba(243, 156, 18, 0.08); margin: 10px 0; border-radius: 0 8px 8px 0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #444; font-size: 0.8rem; cursor: pointer; }
        .score-badge { background: #444; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="settings-toggle" onclick="toggleSettings()">
        <span>⚙️ 塾生用設定パネル</span>
        <span class="version-tag">ver 1.6.0 Stable</span>
    </div>
    <div id="settings-area">
        <div style="font-size:0.7rem; color:var(--primary); margin-bottom:5px;">System Key:</div>
        <input type="password" id="x-system-key-storage" style="width:100%; padding:10px; background:#111; color:#eee; border:1px solid #444; border-radius:6px; box-sizing:border-box;" placeholder="キーを入力">
    </div>

    <div class="card">
        <div class="header-flex"><h1>分析パネル</h1><span style="font-size:0.6rem; color:#888;">SAPIX偏差値準拠</span></div>
        <div style="display:flex; justify-content:space-around; text-align:center;">
            <div><div style="font-size:0.7rem; color:#aaa;">想定偏差値</div><div id="dev-val" style="font-size:1.5rem; font-weight:bold; color:var(--primary);">--</div></div>
            <div><div style="font-size:0.7rem; color:#aaa;">累計演習</div><div id="count-val" style="font-size:1.5rem; font-weight:bold; color:var(--primary);">0</div></div>
        </div>
        <div id="unit-chart" style="margin-top:10px; font-size:0.8rem;"></div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>演習 [<span id="u-title"></span>]</h1>
            <button onclick="doSkip()" style="background:var(--skip); color:white; border:none; border-radius:4px; padding:4px 10px; font-size:0.7rem; width:auto;">SKIP</button>
        </div>
        <div class="canvas-container" id="zoom-box">
            <div id="svg-layer"></div>
        </div>
        <p id="p-text" style="font-weight:bold; margin: 8px 0;"></p>
        <ul id="q-list" style="padding-left: 20px; margin: 8px 0;"></ul>
        <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:6px; width:auto; font-size:0.8rem;">💡 ヒント</button>
        <div id="h-box" class="hint-box"></div>
        <button class="btn-ai-gen" onclick="generateNext()">✨ AIによる類題を作成</button>
    </div>

    <div class="card">
        <button class="btn-camera" onclick="document.getElementById('c-input').click()">📸 採点する</button>
        <input type="file" id="c-input" accept="image/*" capture="environment" style="display:none">
        <div id="res-box" style="background:#111; padding:15px; border-radius:8px; display:none; border-left:4px solid var(--primary); white-space:pre-wrap; font-size:0.85rem; margin-top:10px;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>復習リスト</h1><button onclick="resetData()" style="background:none; border:none; color:#888; font-size:0.7rem; width:auto;">リセット</button></div>
        <div id="hist-list"></div>
    </div>

    <div id="status-ui" class="loading-overlay">
        <div id="timer" style="font-size:1.5rem; color:var(--ai);">0.0s</div>
        <p id="msg"></p>
    </div>

    <script>
        const MODEL = "gemini-1.5-flash";
        let state = { prob: {}, scale: 1, x: 0, y: 0, t: null };

        // 1問目のデータを即座に描画
        const initData = {
            unit: "立体図形",
            text: "一辺6の立方体ABCD-EFGHがある。辺AB, BC, CGの中点をそれぞれP, Q, Rとする。",
            sub: ["(1) 3点P, Q, Rを通る平面で切断したときの、切り口の形状を答えよ。", "(2) 立方体の頂点Bを含む方の立体の体積を求めよ。"],
            svg: `<svg viewBox="0 0 200 200"><path d="M40 70 L120 70 L120 150 L40 150 Z" fill="none" stroke="#333"/><path d="M75 35 L155 35 L155 115 L75 115 Z" fill="none" stroke="#333" stroke-dasharray="2"/><path d="M40 70 L75 35 M120 70 L155 35 M120 150 L155 115 M40 150 L75 115" fill="none" stroke="#333"/><path d="M80 70 L137.5 52.5 L155 75 Z" fill="rgba(231,76,60,0.3)" stroke="#e74c3c" stroke-width="2"/><text x="75" y="65" font-size="12" font-weight="bold">P</text><text x="145" y="50" font-size="12" font-weight="bold">Q</text><text x="160" y="85" font-size="12" font-weight="bold">R</text></svg>`,
            hint: "切り口は正三角形になります。"
        };

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('gemini_api_key');
            if (saved) document.getElementById('x-system-key-storage').value = saved;
            applyProb(initData);
            refreshStats();
        });

        function applyProb(p) {
            state.prob = p;
            document.getElementById('u-title').innerText = p.unit;
            document.getElementById('p-text').innerText = p.text;
            document.getElementById('q-list').innerHTML = (p.sub || []).map(s => `<li>${s}</li>`).join('');
            document.getElementById('h-box').innerText = p.hint || "";
            document.getElementById('h-box').style.display = 'none';
            document.getElementById('res-box').style.display = 'none';
            
            // 図の描画（最も確実な手法）
            const layer = document.getElementById('svg-layer');
            if (p.svg) {
                layer.innerHTML = p.svg;
                // 万が一描画が崩れた場合用のリセット
                state.scale = 1; state.x = 0; state.y = 0;
                updateView();
            } else {
                layer.innerHTML = "図解生成中...";
            }
        }

        async function generateNext() {
            const key = document.getElementById('x-system-key-storage').value;
            if(!key) return alert("Keyを入力してください");
            localStorage.setItem('gemini_api_key', key);
            
            showUI("思考中...");
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `最難関高校講師。問題「${state.prob.text}」の類題をJSONで。必ず「〜を求めよ」という問いで完結させること。{"unit":"...","text":"...","sub":["..."],"hint":"..."}` }] }] })
                });
                const data = await res.json();
                const json = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]);
                applyProb(json);
                hideUI();
                autoDraw(key);
            } catch (e) { hideUI(); alert("生成失敗"); }
        }

        async function autoDraw(key) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `問題「${state.prob.text}」の見取り図をSVGで。奥行きを出すため斜め45度方向の辺を描き、絶対に正方形（平面図）にしないでください。比は緑、切断は赤。{"svg":"<svg>...</svg>"}` }] }] })
                });
                const data = await res.json();
                const svg = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]).svg;
                state.prob.svg = svg;
                document.getElementById('svg-layer').innerHTML = svg;
            } catch (e) { document.getElementById('svg-layer').innerHTML = "作図失敗"; }
        }

        async function doGrade(file) {
            const key = document.getElementById('x-system-key-storage').value;
            showUI("採点中...");
            const reader = new FileReader();
            reader.onload = async (e) => {
                const b64 = e.target.result.split(',')[1];
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${key}`, {
                        method: "POST", headers: {"Content-Type": "application/json"},
                        body: JSON.stringify({ contents: [{ parts: [{ text: `最難関講師。問題：${state.prob.text}。【Score: X/10】で採点し解説。` }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }] })
                    });
                    const data = await res.json();
                    const fb = data.candidates[0].content.parts[0].text;
                    document.getElementById('res-box').innerText = fb;
                    document.getElementById('res-box').style.display = 'block';
                    const score = (fb.match(/Score:\s*(\d+)/)||[0,0])[1];
                    saveLog(score >= 8 ? "○" : "×", parseInt(score));
                } catch (e) { alert("採点失敗"); } finally { hideUI(); }
            };
            reader.readAsDataURL(file);
        }

        function saveLog(mark, score) {
            let h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            h.unshift({ d: new Date().toLocaleDateString(), u: state.prob.unit, m: mark, s: score, p: JSON.parse(JSON.stringify(state.prob)) });
            localStorage.setItem('m_hist', JSON.stringify(h.slice(0, 30)));
            refreshStats();
        }

        function refreshStats() {
            const h = JSON.parse(localStorage.getItem('m_hist') || "[]");
            document.getElementById('count-val').innerText = h.length;
            document.getElementById('hist-list').innerHTML = h.slice(0,10).map((x, i) => `<div class="history-item" onclick="loadHist(${i})"><span>${x.d} ${x.u}</span><div><span class="score-badge">${x.s}/10</span> ${x.m}</div></div>`).join('');
            if (h.length >= 1) {
                const avg = h.map(x => x.s).reduce((a,b)=>a+b,0)/h.length;
                document.getElementById('dev-val').innerText = (40 + (avg * 3.5)).toFixed(1);
            }
        }

        function loadHist(i) { const h = JSON.parse(localStorage.getItem('m_hist')); applyProb(h[i].p); }
        function doSkip() { saveLog("SKIP", 0); generateNext(); }
        function toggleSettings() { const s = document.getElementById('settings-area'); s.style.display = s.style.display === 'block' ? 'none' : 'block'; }
        function toggleHint() { const b = document.getElementById('h-box'); b.style.display = b.style.display === 'block' ? 'none' : 'block'; }
        function resetData() { if(confirm("消去？")) { localStorage.clear(); location.reload(); } }
        function showUI(m) { document.getElementById('status-ui').style.display='block'; document.getElementById('msg').innerText=m; let s=Date.now(); state.t=setInterval(()=>{document.getElementById('timer').innerText=((Date.now()-s)/1000).toFixed(1)+"s";},100); }
        function hideUI() { document.getElementById('status-ui').style.display='none'; clearInterval(state.t); }
        function updateView() { document.getElementById('svg-layer').style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`; }
        document.getElementById('c-input').onchange = (e) => doGrade(e.target.files[0]);
    </script>
</body>
</html>
