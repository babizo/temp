<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>最難関突破 AI数学講師 v1.5.8</title>
    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.4; font-size: 14px; overflow-x: hidden; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .version-tag { font-size: 0.6rem; color: #888; font-family: monospace; }
        
        .settings-toggle { background: #333; color: #888; font-size: 0.7rem; padding: 5px 10px; border-radius: 5px; cursor: pointer; text-align: center; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        #settings-content { display: none; padding: 10px; background: #222; border-radius: 8px; margin-bottom: 10px; }

        /* 分析パネルスタイル */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-box { background: #333; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 0.7rem; color: #aaa; }
        .stat-val { font-size: 1.3rem; font-weight: bold; color: var(--primary); }
        .unit-analysis { font-size: 0.8rem; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px; }
        .unit-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .unit-bar-bg { background: #444; height: 6px; width: 100%; border-radius: 3px; margin-top: 2px; overflow: hidden; }
        .unit-bar-fill { background: var(--success); height: 100%; transition: 0.5s; }

        .canvas-container { background: #ffffff; border-radius: 6px; height: 260px; margin-bottom: 10px; overflow: hidden; position: relative; touch-action: none; cursor: grab; display: flex; align-items: center; justify-content: center; color: #444; flex-direction: column; font-size: 0.8rem; border: 2px solid #333; }
        #svg-content { width: 100%; height: 100%; transform-origin: 0 0; display: flex; align-items: center; justify-content: center; }
        svg { width: 100%; height: 100%; }

        .loading-overlay { display: none; text-align: center; padding: 15px; background: rgba(0,0,0,0.95); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 8px; transition: 0.2s; }
        .btn-camera { background: var(--success); color: white; height: 52px; font-size: 1.1rem; }
        .btn-ai-gen { background: var(--ai); color: white; font-size: 0.9rem; }
        .btn-retry { background: var(--error); color: white; padding: 8px 15px; font-size: 0.8rem; width: auto; margin-top: 10px; border-radius: 5px; }
        
        .hint-box { display: none; color: var(--hint); font-weight: bold; padding: 12px; border-left: 4px solid var(--hint); font-size: 0.85rem; background: rgba(243, 156, 18, 0.08); margin: 10px 0; border-radius: 0 8px 8px 0; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #444; font-size: 0.8rem; cursor: pointer; }
        .score-badge { background: #444; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="settings-toggle" onclick="toggleSettings()">
        <span>⚙️ 設定（API Key等）</span>
        <span class="version-tag">ver 1.5.8 Analysis-Fix</span>
    </div>
    <div id="settings-content">
        <input type="password" id="apiKey" style="width:100%; padding:10px; background:#111; color:#eee; border:1px solid #444; border-radius:6px; box-sizing:border-box;" placeholder="Gemini API Key を入力">
    </div>

    <div class="card">
        <div class="header-flex"><h1>分析パネル</h1><span style="font-size:0.6rem; color:#888;">SAPIX基準</span></div>
        <div class="stats-grid">
            <div class="stat-box"><div class="stat-label">あなたの想定偏差値</div><div class="stat-val" id="sapix-dev">--</div></div>
            <div class="stat-box"><div class="stat-label">累計演習数</div><div class="stat-val" id="total-count">0</div></div>
        </div>
        <div id="unit-analysis" class="unit-analysis"></div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>2. 演習 [<span id="unit-name"></span>]</h1>
            <button onclick="skipProblem()" style="background:var(--skip); color:white; border:none; border-radius:4px; padding:4px 10px; font-size:0.7rem; width:auto;">SKIP ≫</button>
        </div>
        <div class="canvas-container" id="zoom-container">
            <div id="svg-content"></div>
        </div>
        <p id="problem-text" style="font-weight:bold; margin: 8px 0; font-size: 1rem;"></p>
        <ul id="sub-questions" style="padding-left: 20px; margin: 8px 0;"></ul>
        <button onclick="toggleHint()" style="background:none; color:var(--hint); border:1px solid var(--hint); padding:6px; width:auto; font-size:0.8rem; margin-top:5px;">💡 ヒントを表示</button>
        <div id="hint-area" class="hint-box"></div>
        <button class="btn-ai-gen" onclick="safeGenerateSimilar()">✨ AIによる類題を作成</button>
    </div>

    <div class="card">
        <button class="btn-camera" onclick="document.getElementById('cameraInput').click()">📸 撮影して添削・採点</button>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
        <div id="result" style="background:#111; padding:15px; border-radius:8px; display:none; border-left:4px solid var(--primary); white-space:pre-wrap; font-size:0.85rem; margin-top:10px;"></div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>4. 復習リスト</h1><button onclick="clearHistory()" style="background:none; border:none; color:#888; font-size:0.7rem; width:auto;">全消去</button></div>
        <div id="history-list"></div>
    </div>

    <div id="ai-status" class="loading-overlay">
        <div id="timer-count" style="font-size:1.5rem; color:var(--ai);">0.0s</div>
        <p id="ai-msg"></p>
    </div>

    <script>
        const AI_MODEL = "gemini-1.5-flash";
        let state = { currentProb: {}, scale: 1, offsetX: 0, offsetY: 0, timerInterval: null };

        const initialProb = {
            unit: "立体図形",
            text: "一辺6の立方体ABCD-EFGHがある。辺AB, BC, CGの中点をそれぞれP, Q, Rとする。",
            sub: ["(1) 3点P, Q, Rを通る平面で切断したときの、切り口の形状を答えよ。", "(2) 立方体の頂点Bを含む方の立体の体積を求めよ。"],
            svg: `<svg viewBox="0 0 200 200"><path d="M40 70 L120 70 L120 150 L40 150 Z" fill="none" stroke="#333"/><path d="M75 35 L155 35 L155 115 L75 115 Z" fill="none" stroke="#333" stroke-dasharray="2"/><path d="M40 70 L75 35 M120 70 L155 35 M120 150 L155 115 M40 150 L75 115" fill="none" stroke="#333"/><path d="M80 70 L137.5 52.5 L155 75 Z" fill="rgba(231,76,60,0.3)" stroke="#e74c3c" stroke-width="2"/><text x="75" y="65" font-size="12" font-weight="bold">P</text><text x="145" y="50" font-size="12" font-weight="bold">Q</text><text x="160" y="85" font-size="12" font-weight="bold">R</text></svg>`,
            hint: "切り口は正三角形になります。中点連結定理を活用しましょう。"
        };

        window.onload = () => {
            const k = localStorage.getItem('gemini_api_key');
            if (k) document.getElementById('apiKey').value = k;
            renderProblem(initialProb);
            updateAnalysis();
        };

        function renderProblem(prob) {
            state.currentProb = prob;
            const sanitize = (s) => (typeof s === 'string') ? s.replace(/\{unit\}/g, prob.unit || "").replace(/\{.*?\}/g, "") : "";
            document.getElementById('unit-name').innerText = sanitize(prob.unit);
            document.getElementById('problem-text').innerText = sanitize(prob.text);
            document.getElementById('sub-questions').innerHTML = (prob.sub || []).map(s => `<li>${sanitize(s)}</li>`).join('');
            document.getElementById('hint-area').innerText = sanitize(prob.hint) || "ヒントなし";
            document.getElementById('hint-area').style.display = 'none';
            
            const svgCont = document.getElementById('svg-content');
            if (prob.svg) {
                const node = new DOMParser().parseFromString(prob.svg, "image/svg+xml").querySelector("svg");
                if (node) { svgCont.innerHTML = ""; svgCont.appendChild(node); }
            }
        }

        async function safeGenerateSimilar() {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("API Keyを入力してください");
            localStorage.setItem('gemini_api_key', key);
            startStatusUI("類題を考案中...");
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "最難関高校講師。問題「" + state.currentProb.text + "」の類題をJSONで。必ず「〜を求めよ」という問いを含めること。{\"unit\":\"...\",\"text\":\"...\",\"sub\":[\"...\"],\"hint\":\"...\"}" }] }] })
                });
                const data = await res.json();
                const jsonText = data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0];
                renderProblem(JSON.parse(jsonText));
                stopStatusUI();
                autoDraw(key);
            } catch (e) { stopStatusUI(); alert("通信エラーが発生しました"); }
        }

        async function autoDraw(key) {
            const svgCont = document.getElementById('svg-content');
            svgCont.innerHTML = "見取り図を作成中...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "問題「" + state.currentProb.text + "」の見取り図をSVGで。奥行きを出すため斜め45度方向の辺を必ず描き、比は緑、切断は赤。{\"svg\":\"<svg>...</svg>\"}" }] }] })
                });
                const data = await res.json();
                const svgCode = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]).svg;
                const node = new DOMParser().parseFromString(svgCode, "image/svg+xml").querySelector("svg");
                if (node) { svgCont.innerHTML = ""; svgCont.appendChild(node); }
            } catch (e) { svgCont.innerHTML = "作図失敗。類題作成を再試行してください。"; }
        }

        async function startGrading(base64) {
            const key = document.getElementById('apiKey').value;
            startStatusUI("採点中...");
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `最難関講師。問題：${state.currentProb.text}。【Score: X/10】で採点し解説。` }, { inline_data: { mime_type: "image/jpeg", data: base64 } }] }] })
                });
                const data = await res.json();
                const fb = data.candidates[0].content.parts[0].text;
                document.getElementById('result').innerText = fb; document.getElementById('result').style.display = 'block';
                const score = (fb.match(/Score:\s*(\d+)/)||[0,0])[1];
                saveHistory(score >= 8 ? "○" : (score >= 4 ? "△" : "×"), parseInt(score));
                stopStatusUI();
            } catch (e) { stopStatusUI(); alert("採点に失敗しました"); }
        }

        function saveHistory(mark, score) {
            let h = JSON.parse(localStorage.getItem('math_history') || "[]");
            h.unshift({ date: new Date().toLocaleDateString(), unit: state.currentProb.unit, mark: mark, score: score, prob: JSON.parse(JSON.stringify(state.currentProb)) });
            localStorage.setItem('math_history', JSON.stringify(h.slice(0, 30)));
            updateAnalysis();
        }

        function updateAnalysis() {
            const h = JSON.parse(localStorage.getItem('math_history') || "[]");
            document.getElementById('total-count').innerText = h.length;
            const histList = document.getElementById('history-list');
            histList.innerHTML = h.slice(0,10).map((x, i) => `<div class="history-item" onclick="loadHist(${i})"><span>${x.date} ${x.unit}</span><div><span class="score-badge">${x.score}/10</span> ${x.mark}</div></div>`).join('');
            
            if (h.length >= 2) {
                const avg = h.map(x => x.score).reduce((a,b)=>a+b,0)/h.length;
                document.getElementById('sapix-dev').innerText = (40 + (avg * 2.5)).toFixed(1);
            }

            const units = {};
            h.forEach(x => { if(!units[x.unit]) units[x.unit]={s:0,c:0}; units[x.unit].s+=x.score; units[x.unit].c++; });
            let html = "";
            for(let u in units) {
                const a = units[u].s/units[u].c;
                html += `<div><div class="unit-row"><span>${u}</span><span>${a.toFixed(1)}/10</span></div><div class="unit-bar-bg"><div class="unit-bar-fill" style="width:${a*10}%; background:${a>=8?'#27ae60':(a<=4?'#e74c3c':'#5dade2')}"></div></div></div>`;
            }
            document.getElementById('unit-analysis').innerHTML = html;
        }

        function loadHist(i) { const h = JSON.parse(localStorage.getItem('math_history')); if (confirm("再挑戦？")) renderProblem(h[i].prob); }
        function skipProblem() { saveHistory("SKIP", 0); safeGenerateSimilar(); }
        function toggleSettings() { const c = document.getElementById('settings-content'); c.style.display = (c.style.display === 'block') ? 'none' : 'block'; }
        function toggleHint() { const h = document.getElementById('hint-area'); h.style.display = (h.style.display==='block')?'none':'block'; }
        function clearHistory() { if(confirm("消去？")) { localStorage.removeItem('math_history'); location.reload(); } }
        function startStatusUI(m) { document.getElementById('ai-status').style.display='block'; document.getElementById('ai-msg').innerText=m; let s=Date.now(); state.timerInterval=setInterval(() => { document.getElementById('timer-count').innerText=((Date.now()-s)/1000).toFixed(1)+"s"; },100); }
        function stopStatusUI() { document.getElementById('ai-status').style.display='none'; clearInterval(state.timerInterval); }
        document.getElementById('cameraInput').onchange = (e) => { const r=new FileReader(); r.onloadend=()=>startGrading(r.result.split(',')[1]); r.readAsDataURL(e.target.files[0]); };
    </script>
</body>
</html>
