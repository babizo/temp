<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>最難関突破 AI数学講師 v1.5.6</title>
    <style>
        :root { --primary: #5dade2; --bg: #1a1a1a; --card: #262626; --text: #eeeeee; --success: #27ae60; --hint: #f39c12; --error: #e74c3c; --skip: #95a5a6; --ai: #a29bfe; }
        body { font-family: sans-serif; background-color: var(--bg); color: var(--text); padding: 10px; max-width: 500px; margin: auto; line-height: 1.4; font-size: 14px; overflow-x: hidden; }
        .card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #444; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 10px; padding-bottom: 5px; }
        h1 { color: var(--primary); font-size: 1.1rem; margin: 0; }
        .version-tag { font-size: 0.6rem; color: #888; font-family: monospace; }
        
        .settings-toggle { background: #333; color: #888; font-size: 0.7rem; padding: 5px 10px; border-radius: 5px; cursor: pointer; text-align: center; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        #settings-content { display: none; padding: 10px; background: #222; border-radius: 8px; margin-bottom: 10px; }

        .canvas-container { background: #ffffff; border-radius: 6px; height: 260px; margin-bottom: 10px; overflow: hidden; position: relative; touch-action: none; cursor: grab; display: flex; align-items: center; justify-content: center; color: #888; flex-direction: column; font-size: 0.8rem; }
        #svg-content { width: 100%; height: 100%; transform-origin: 0 0; display: flex; align-items: center; justify-content: center; }
        svg { width: 100%; height: 100%; }

        .loading-overlay { display: none; text-align: center; padding: 15px; background: rgba(0,0,0,0.95); border-radius: 10px; border: 1px solid var(--ai); position: fixed; top: 20%; left: 50%; transform: translateX(-50%); z-index: 1000; width: 85%; }
        
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 8px; transition: 0.2s; }
        .btn-camera { background: var(--success); color: white; height: 52px; font-size: 1.1rem; }
        .btn-ai-gen { background: var(--ai); color: white; font-size: 0.9rem; }
        .btn-retry { background: var(--error); color: white; padding: 8px 15px; font-size: 0.8rem; width: auto; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="settings-toggle" onclick="toggleSettings()">
        <span>⚙️ 設定（API Key等）</span>
        <span class="version-tag">ver 1.5.6 Stable</span>
    </div>
    <div id="settings-content">
        <div style="font-size:0.7rem; color:var(--primary); margin-bottom:5px;">Gemini API Key:</div>
        <input type="password" id="apiKey" style="width:100%; padding:10px; background:#111; color:#eee; border:1px solid #444; border-radius:6px; box-sizing:border-box;" placeholder="キーを入力してください">
        <div style="font-size:0.6rem; color:#888; margin-top:5px;">※入力後、類題作成時に自動保存されます。</div>
    </div>

    <div class="card">
        <div class="header-flex"><h1>分析パネル</h1></div>
        <div id="sapix-dev" style="font-size:1.3rem; font-weight:bold; color:var(--primary);">--</div>
    </div>

    <div class="card">
        <div class="header-flex">
            <h1>2. 演習 [<span id="unit-name"></span>]</h1>
            <button onclick="skipProblem()" style="background:var(--skip); color:white; border:none; border-radius:4px; padding:4px 10px; font-size:0.7rem; width:auto;">SKIP ≫</button>
        </div>
        <div class="canvas-container" id="zoom-container">
            <div id="svg-content"></div>
        </div>
        <p id="problem-text" style="font-weight:bold; margin: 8px 0; font-size: 1rem;"></p>
        <ul id="sub-questions" style="padding-left: 20px; margin: 8px 0;"></ul>
        <button class="btn-ai-gen" onclick="generateSimilarTextOnly()">✨ AIによる類題を作成</button>
    </div>

    <div id="ai-status" class="loading-overlay">
        <div id="timer-count" style="font-size:1.5rem; color:var(--ai);">0.0s</div>
        <p id="ai-msg"></p>
    </div>

    <script>
        const MODEL_NAME = "gemini-1.5-flash"; // 安定モデルに変更
        let currentProb = {};
        let scale = 1, offsetX = 0, offsetY = 0;

        const initialProb = {
            unit: "立体図形",
            text: "一辺6の立方体ABCD-EFGHがある。辺AB, BC, CGの中点をそれぞれP, Q, Rとする。",
            sub: ["(1) 3点P, Q, Rを通る平面で切断したときの、切り口の形状を答えよ。", "(2) 立方体の頂点Bを含む方の立体の体積を求めよ。"],
            svg: `<svg viewBox="0 0 200 180"><path d="M40 65 L120 65 L120 145 L40 145 Z" fill="none" stroke="#333"/><path d="M70 35 L150 35 L150 115 L70 115 Z" fill="none" stroke="#333"/><path d="M40 65 L70 35 M120 65 L150 35 M120 145 L150 115 M40 145 L70 115" fill="none" stroke="#333"/><path d="M80 65 L135 50 L150 75 Z" fill="rgba(231,76,60,0.3)" stroke="#e74c3c" stroke-width="2"/><text x="72" y="60" font-size="12" font-weight="bold">P</text><text x="140" y="45" font-size="12" font-weight="bold">Q</text><text x="155" y="80" font-size="12" font-weight="bold">R</text></svg>`
        };

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            displayProblem(initialProb);
        };

        function displayProblem(prob) {
            currentProb = prob;
            document.getElementById('unit-name').innerText = prob.unit;
            document.getElementById('problem-text').innerText = prob.text;
            document.getElementById('sub-questions').innerHTML = (prob.sub || []).map(s => `<li>${s}</li>`).join('');
            
            const svgCont = document.getElementById('svg-content');
            if (prob.svg) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(prob.svg, "image/svg+xml");
                const svgNode = doc.querySelector("svg");
                if (svgNode) {
                    svgCont.innerHTML = "";
                    svgCont.appendChild(svgNode);
                }
            }
        }

        async function generateSimilarTextOnly() {
            const key = document.getElementById('apiKey').value;
            if(!key) return alert("API Keyを設定してください");
            localStorage.setItem('gemini_api_key', key);
            
            startStatusUI("通信中...");
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "最難関高校数学講師。問題『" + currentProb.text + "』の類題をJSONで作成。{\"unit\":\"...\",\"text\":\"...\",\"sub\":[\"...\"],\"hint\":\"...\"}" }] }] })
                });
                
                if (!res.ok) {
                    const errData = await res.json();
                    console.error("API Error Detail:", errData);
                    throw new Error("HTTP " + res.status);
                }

                const data = await res.json();
                const jsonText = data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0];
                displayProblem(JSON.parse(jsonText));
                stopStatusUI();
                autoGenerateSVG(3);
            } catch (e) {
                stopStatusUI();
                console.error("生成失敗の要因:", e);
                alert("生成失敗: キーが正しいか、通信環境を確認してください。");
            }
        }

        async function autoGenerateSVG(retryCount) {
            const key = document.getElementById('apiKey').value;
            const svgCont = document.getElementById('svg-content');
            svgCont.innerHTML = "作図中...";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "問題：『" + currentProb.text + "』の図解SVGをJSONで。{\"svg\":\"<svg>...</svg>\"}" }] }] })
                });
                const data = await res.json();
                const svgCode = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{[\s\S]*\}/)[0]).svg;
                const parser = new DOMParser();
                const svgNode = parser.parseFromString(svgCode, "image/svg+xml").querySelector("svg");
                if (svgNode) { svgCont.innerHTML = ""; svgCont.appendChild(svgNode); }
            } catch (e) {
                if (retryCount > 1) setTimeout(() => autoGenerateSVG(retryCount - 1), 1000);
                else svgCont.innerHTML = "作図失敗";
            }
        }

        function toggleSettings() {
            const c = document.getElementById('settings-content');
            c.style.display = (c.style.display === 'block') ? 'none' : 'block';
        }
        function startStatusUI(m) { document.getElementById('ai-status').style.display='block'; document.getElementById('ai-msg').innerText=m; }
        function stopStatusUI() { document.getElementById('ai-status').style.display='none'; }
    </script>
</body>
</html>
