<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>最難関突破・今日の一問（高コントラスト版）</title>
    <style>
        /* ダークモードでも読みやすい配色設定 */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.6; padding: 20px; background-color: #1a1a1a; color: #eeeeee; max-width: 800px; margin: auto; }
        .problem-box { border: 2px solid #444; padding: 20px; border-radius: 8px; background: #262626; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #5dade2; font-size: 1.5em; border-bottom: 2px solid #5dade2; padding-bottom: 10px; }
        
        /* 図のエリアは白背景で固定し、視認性を最大化 */
        .canvas-container { 
            text-align: center; 
            margin: 20px 0; 
            background: #ffffff; /* 白背景固定 */
            padding: 20px; 
            border-radius: 8px; 
            display: flex;
            justify-content: center;
        }
        .math { font-style: italic; font-family: 'Times New Roman', serif; color: #5dade2; font-weight: bold; }
        ol li { margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="problem-box">
    <h1>最難関突破・今日の一問（視認性向上版）</h1>
    <p>
        座標平面上に、3点 <span class="math">A(0, 12), B(-6, 0), C(6, 0)</span> を頂点とする二等辺三角形 <span class="math">ABC</span> がある。
        辺 <span class="math">AC</span> 上に点 <span class="math">P</span> をとり、点 <span class="math">P</span> から <span class="math">x</span> 軸に下ろした垂線を <span class="math">PQ</span> とする。
        また、辺 <span class="math">AB</span> 上に点 <span class="math">R</span> を、線分 <span class="math">RQ</span> が <span class="math">x</span> 軸と平行になるようにとる。
    </p>
    
    <div class="canvas-container">
        <svg width="500" height="400" viewBox="-110 -20 220 170" xmlns="http://www.w3.org/2000/svg">
            <g transform="scale(1, -1) translate(0, -130)">
                <g stroke="#e0e0e0" stroke-width="0.5">
                    <path d="M -80 0 L -80 130 M -60 0 L -60 130 M -40 0 L -40 130 M -20 0 L -20 130 M 20 0 L 20 130 M 40 0 L 40 130 M 60 0 L 60 130 M 80 0 L 80 130" />
                    <path d="M -95 0 L 95 0 M -95 20 L 95 20 M -95 40 L 95 40 M -95 60 L 95 60 M -95 80 L 95 80 M -95 100 L 95 100 M -95 120 L 95 120" />
                </g>
                
                <line x1="-100" y1="0" x2="100" y2="0" stroke="#000" stroke-width="2" />
                <line x1="0" y1="-10" x2="0" y2="140" stroke="#000" stroke-width="2" />

                <path d="M -60 0 L 0 120 L 60 0 Z" fill="rgba(41, 128, 185, 0.15)" stroke="#2980b9" stroke-width="2.5" />

                <line x1="30" y1="60" x2="30" y2="0" stroke="#c0392b" stroke-width="2.5" /> <line x1="-30" y1="60" x2="30" y2="60" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5" /> <path d="M -30 60 L 30 60 L 30 0 L 60 0 Z" fill="rgba(192, 57, 43, 0.2)" /> <circle cx="30" cy="60" r="4" fill="#c0392b" /> <circle cx="30" cy="0" r="4" fill="#c0392b" />  <circle cx="-30" cy="60" r="4" fill="#c0392b" /> </g>

            <text x="95" y="135" font-size="12" font-weight="bold" fill="#000">x</text>
            <text x="10" y="10" font-size="12" font-weight="bold" fill="#000">y</text>
            <text x="-15" y="145" font-size="12" fill="#000">O</text>
            
            <text x="-25" y="10" font-size="12" font-weight="bold" fill="#2980b9">A(0,12)</text>
            <text x="-105" y="140" font-size="11" fill="#000">B(-6,0)</text>
            <text x="65" y="140" font-size="11" fill="#000">C(6,0)</text>
            
            <text x="38" y="65" font-size="12" fill="#c0392b" font-weight="bold">P(t, -2t+12)</text>
            <text x="38" y="145" font-size="12" fill="#c0392b" font-weight="bold">Q(t, 0)</text>
            <text x="-55" y="65" font-size="12" fill="#c0392b" font-weight="bold">R</text>
        </svg>
    </div>

    <ol>
        <li>点 <span class="math">P</span> の <span class="math">x</span> 座標を <span class="math">t (0 < t < 6)</span> とするとき、線分 <span class="math">PQ</span> の長さを <span class="math">t</span> を用いて表せ。</li>
        <li>四角形 <span class="math">RPQC</span> の面積が最大となるときの <span class="math">t</span> の値と、その時の面積の最大値を求めよ。</li>
    </ol>
</div>

</body>
</html>
